name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    outputs:
      version: ${{ steps.ver.outputs.next }}
    if: ${{ github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Resolve next version
        id: ver
        run: |
          set -euo pipefail
          PREV=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n1 || true)
          BASE=${PREV:-v0.0.0}
          IFS=. read -r MA MI PA <<< "${BASE#v}"
          NEW="v${MA}.${MI}.$((PA + 1))"
          echo "prev=${PREV}" >> "$GITHUB_OUTPUT"
          echo "next=${NEW}" >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:-<none>} -> Next: ${NEW}"

      - name: Build changelog
        id: log
        run: |
          set -euo pipefail
          PREV='${{ steps.ver.outputs.prev }}'
          if [ -z "$PREV" ]; then RANGE=HEAD; else RANGE="${PREV}..HEAD"; fi
          {
            echo 'body<<CHANGELOG_EOF'
            echo '## Changes'
            git log "$RANGE" --pretty='- %s (%h)' --no-merges || echo '- Initial release'
            echo 'CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build cross-platform binaries into dist/
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            GOOS=${target%%/*}
            GOARCH=${target##*/}
            EXT=''
            [ "$GOOS" = windows ] && EXT='.exe'
            CGO_ENABLED=0 GOOS=$GOOS GOARCH=$GOARCH go build \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "dist/meoo2api-${GOOS}-${GOARCH}${EXT}" \
              ./cmd/server
          done

      - name: Verify artifacts
        run: |
          set -euo pipefail
          [ -n "$(ls -A dist)" ] || { echo "::error::dist/ is empty"; exit 1; }
          ls -la dist
          (cd dist && sha256sum * > SHA256SUMS)

      - name: Build & push image to GHCR
        env:
          VERSION: ${{ steps.ver.outputs.next }}
        run: |
          set -euo pipefail
          # 镜像 tag 不带 v 前缀，且必须全小写
          # 用 printf 转小写而不是 ${VAR,,}：后者是 bash 4+ 特性，本地干跑会报 bad substitution
          IMAGE="ghcr.io/$(printf '%s' "$GITHUB_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          SHORT="$(git rev-parse --short=7 HEAD)"
          VER="${VERSION#v}"
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker build --build-arg VERSION="$VERSION" \
            -t "$IMAGE:$VER" -t "$IMAGE:latest" -t "$IMAGE:sha-$SHORT" .
          docker push "$IMAGE:$VER"
          docker push "$IMAGE:latest"
          docker push "$IMAGE:sha-$SHORT"
          echo "pushed $IMAGE:$VER / latest / sha-$SHORT"

      - name: Create tag
        run: |
          set -euo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git tag -a '${{ steps.ver.outputs.next }}' -m 'Release ${{ steps.ver.outputs.next }}'
          git push origin '${{ steps.ver.outputs.next }}'

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release create '${{ steps.ver.outputs.next }}' \
            --title 'Release ${{ steps.ver.outputs.next }}' \
            --notes '${{ steps.log.outputs.body }}' \
            dist/*

      - name: Move latest tag
        run: |
          set -euo pipefail
          git tag -f latest '${{ steps.ver.outputs.next }}'
          git push -f origin latest

      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ steps.ver.outputs.next }}
          path: dist/
          retention-days: 30

  # 部署到 ai-prod：只消费 release 产出的版本号，不重复判断版本逻辑
  deploy:
    needs: release
    if: ${{ needs.release.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to ai-prod
        env:
          SSH_KEY: ${{ secrets.AI_PROD_SSH_KEY }}
          HOST: ${{ secrets.AI_PROD_HOST }}
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # 首次连接不交互确认；已知主机指纹由密钥本身保证（专用 key 只在 ci 机器与本机存在）
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15 \
            "root@${HOST}" "/opt/meoo2api/update.sh ${VERSION}"
          rm -f ~/.ssh/deploy_key

      - name: Verify public endpoint
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          set -euo pipefail
          # 走公网域名验证，确认 nginx → 容器这条链路也通，而不只是容器自己活着
          for i in $(seq 1 10); do
            BODY=$(curl -sf -m 10 https://meoo2api.1task.cn/healthz || true)
            [ -n "$BODY" ] && break
            sleep 3
          done
          echo "$BODY"
          python3 - "$VERSION" "$BODY" <<'PY'
          import json, sys
          want, body = sys.argv[1].lstrip("v"), sys.argv[2]
          d = json.loads(body)
          assert d["version"].lstrip("v") == want, f"公网版本不符：期望 {want}，实际 {d['version']}"
          print(f"  公网验收 OK · version={d['version']} · usable={d.get('usable')}")
          PY
