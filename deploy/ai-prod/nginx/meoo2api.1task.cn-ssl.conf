# meoo2api HTTPS 入口
# 证书：acme.sh（Let's Encrypt），HTTP-01，自动续期并 reload nginx。
#
# ⚠️ 本文件被 nginx 在 http 块内 include ⇒ limit_req_zone 可以写在 server 之外。
limit_req_zone $binary_remote_addr zone=meoo2api_edge:10m rate=1200r/m;

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name meoo2api.1task.cn;

    ssl_certificate     /www/server/panel/vhost/cert/meoo2api.1task.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/meoo2api.1task.cn/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    access_log /www/wwwlogs/meoo2api.1task.cn.log;
    error_log  /www/wwwlogs/meoo2api.1task.cn.error.log;

    # 长上下文请求体可达 1.7MB（280k tokens 实测），默认 1m 会被 413
    client_max_body_size 32m;

    location / {
        limit_req zone=meoo2api_edge burst=120 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:8791;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        # SSE 必须关缓冲：否则 token 会被 nginx 攒着，客户端看不到流式增量
        proxy_buffering off;
        proxy_cache off;
        # 推理模型首帧可能十几秒，长上下文更久；默认 60s 会把正常请求切断
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 15s;
    }
}
