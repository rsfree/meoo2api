<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meoo2api 控制台</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b7cfa'/%3E%3Cpath d='M9 20.5v-9l7 5.5 7-5.5v9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* 主题在首帧前定好，避免浅色闪一下再变深。三态：auto / light / dark。 */
(function () {
  var t = "auto";
  try { t = localStorage.getItem("meoo.theme") || "auto"; } catch (e) {}
  var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = t;
})();
</script>
<style>
/* ── 设计令牌：明暗两套独立色板 ─────────────────────────────────────
   冷石墨基调 + 单一靛蓝强调（只给交互），语义色只给状态。
   --ink-3 承载表头/时间戳/说明（11.5px 小字），两套都按 AA 4.5:1 取值；
   实心按钮单独用 --accent-solid（--accent 叠白字只有 3.68:1，不达标）。 */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f8f9fb; --raise: #ffffff;
  --line: #e2e5ec; --line-soft: #eceef3;
  --ink: #14171f; --ink-2: #545c6e; --ink-3: #666e7f;
  --accent: #3d5fe0; --accent-solid: #3d5fe0; --accent-ink: #fff; --accent-soft: rgba(61,95,224,.09);
  --ok: #0a7a4c; --ok-soft: rgba(10,122,76,.1);
  --warn: #b47611; --warn-soft: rgba(180,118,17,.11);
  --bad: #cf3b34; --bad-soft: rgba(207,59,52,.09);
  --shadow: 0 1px 2px rgba(16,20,32,.06), 0 8px 24px -14px rgba(16,20,32,.14);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html[data-theme="dark"] {
  --bg: #0c0e14; --surface: #14171f; --surface-2: #1a1e28; --raise: #202531;
  --line: #262c3a; --line-soft: #1e232e;
  --ink: #e8ebf2; --ink-2: #a8b0c2; --ink-3: #7c8599;
  --accent: #5b7cfa; --accent-solid: #4a6ae8; --accent-ink: #fff; --accent-soft: rgba(91,124,250,.13);
  --ok: #3ddc97; --ok-soft: rgba(61,220,151,.12);
  --warn: #f5b544; --warn-soft: rgba(245,181,68,.12);
  --bad: #f0655f; --bad-soft: rgba(240,101,95,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }
* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.hint { color: var(--ink-3); font-size: 11.5px; }
.grow { flex: 1; }
.nw { white-space: nowrap; }

/* ── 壳层 ─────────────────────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh; z-index: 40;
}
.brand { padding: 18px 16px 15px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 26px; height: 26px; flex: none; display: block; }
.brand .name { font-weight: 650; letter-spacing: -.01em; font-size: 15px; }
.brand .sub { color: var(--ink-3); font-size: 11px; font-family: var(--mono); margin-top: 2px; }
.nav ul { list-style: none; padding: 8px 8px 10px; flex: 1; overflow-y: auto; }
.nav-h {
  font-size: 10.5px; font-weight: 650; letter-spacing: .08em; color: var(--ink-3);
  padding: 12px 11px 6px; text-transform: uppercase;
}
.nav-h.first { padding-top: 6px; }
.nav-i a {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px; margin-bottom: 2px;
  color: var(--ink-2); text-decoration: none; border-radius: 7px; font-size: 13.5px; cursor: pointer;
  transition: background .12s, color .12s;
}
.nav-i a:hover { background: var(--surface-2); color: var(--ink); }
.nav-i a.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
.nav-i a svg { width: 15px; height: 15px; flex: none; opacity: .85; }
.nav-i a .badge {
  margin-left: auto; font: 600 10.5px var(--mono); padding: 1px 6px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line-soft);
}
.nav-i a .badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.nav .sig { padding: 11px 15px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-3); }
.nav .sig .row { display: flex; align-items: center; gap: 7px; }
.nav .sig .row + .row { margin-top: 5px; font-family: var(--mono); }

.main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 14px; padding: 14px 24px;
  border-bottom: 1px solid var(--line); background: var(--surface); position: sticky; top: 0; z-index: 20;
}
.topbar h2 { font-size: 15.5px; font-weight: 620; letter-spacing: -.01em; white-space: nowrap; }
.topbar .sep { color: var(--ink-3); }
.topbar .meta { color: var(--ink-3); font-size: 12px; font-family: var(--mono); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.view { padding: 22px 24px 60px; max-width: 1560px; margin: 0 auto; width: 100%; }

/* ── 控件 ─────────────────────────────────────────────────────────── */
button {
  font: inherit; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 13px; cursor: pointer;
  transition: border-color .12s, background .12s; white-space: nowrap;
}
button:hover:not(:disabled) { border-color: var(--accent); }
button:disabled { opacity: .5; cursor: default; }
button.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--accent-ink); font-weight: 550; }
button.primary:hover:not(:disabled) { filter: brightness(1.08); }
button.ghost { background: transparent; }
button.danger { color: var(--bad); }
button.danger:hover:not(:disabled) { border-color: var(--bad); }
button.xs { padding: 3.5px 9px; font-size: 12.5px; border-radius: 6px; }
select.xs { width: auto; padding: 3.5px 9px; font-size: 12.5px; border-radius: 6px; }
button.icon { padding: 7px 9px; display: inline-grid; place-items: center; }
input, select, textarea {
  font: inherit; color: var(--ink); background: var(--surface-2);
  border: 1px solid var(--line); border-radius: 7px; padding: 7px 11px; width: 100%;
}
textarea { resize: vertical; min-height: 120px; font: 12px/1.55 var(--mono); }
input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent); }
input[type=checkbox] { width: auto; accent-color: var(--accent); }
label.fld { display: block; margin-bottom: 14px; }
label.fld > .lb { display: block; font-size: 12.5px; color: var(--ink-2); margin-bottom: 5px; }
label.fld > .hint { display: block; margin-top: 4px; }

.tag {
  display: inline-block; padding: 0 7px; line-height: 19px;
  border-radius: 5px; font-size: 11.5px; font-weight: 550; white-space: nowrap;
}
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.mute { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line); }
.tag.hl { background: var(--accent-soft); color: var(--accent); }
.pulse { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); flex: none; }
.pulse.bad { background: var(--bad); }
.pulse.warn { background: var(--warn); }

/* chips（筛选 / 异常计数） */
.chips { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.chips .chip {
  padding: 2px 10px; border-radius: 999px; font-size: 12px; line-height: 20px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2); cursor: pointer;
}
.chips .chip:hover { border-color: var(--accent); }
.chips .chip.on { background: var(--accent-soft); color: var(--accent); border-color: transparent; font-weight: 550; }
.chips .chip .n { font-family: var(--mono); font-weight: 600; margin-left: 4px; }

/* ── 统计条 ───────────────────────────────────────────────────────── */
.stats {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
  border: 1px solid var(--line); border-radius: 11px; background: var(--surface);
  overflow: hidden; margin-bottom: 18px; box-shadow: var(--shadow);
}
@media (max-width: 1280px) { .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
.stat { padding: 13px 16px; border-right: 1px solid var(--line-soft); border-bottom: 1px solid var(--line-soft); min-width: 0; }
.stat .v {
  font: 600 25px/1.15 var(--mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.stat .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.stat .k { color: var(--ink-3); font-size: 11.5px; margin-top: 5px; }
.stat.good .v { color: var(--ok); }
.stat.warn .v { color: var(--warn); }
.stat.bad .v { color: var(--bad); }
.stat.hl .v { color: var(--accent); }

/* ── 面板块 ───────────────────────────────────────────────────────── */
.box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); margin-bottom: 18px; overflow: hidden; }
.box > header { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-bottom: 1px solid var(--line-soft); flex-wrap: wrap; }
.box > header h3 { font-size: 13.5px; font-weight: 600; white-space: nowrap; }
.box > header h3 .hint { font-size: 11.5px; font-weight: 400; margin-left: 6px; }
.box > header .grow { flex: 1; }
.box > header .note { color: var(--ink-3); font-size: 12px; white-space: nowrap; }
.box > header select, .box > header input { width: auto; }
.box .pad { padding: 14px; }
.box .foot { padding: 10px 14px; border-top: 1px solid var(--line-soft); display: flex; align-items: center; gap: 9px; }

/* ── 账号表：健康色条 + 紧凑行 ───────────────────────────────────── */
.tbl-wrap { overflow-x: auto; }
.acc { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 820px; }
.acc.wide { min-width: 1060px; }
.acc th {
  text-align: left; font-weight: 500; font-size: 11.5px; color: var(--ink-3);
  padding: 9px 11px; border-bottom: 1px solid var(--line); white-space: nowrap; background: var(--surface);
}
.acc th.sortable { cursor: pointer; user-select: none; }
.acc th.sortable:hover { color: var(--ink); }
.acc th .arrow { opacity: .45; margin-left: 3px; font-size: 10px; }
.acc td { padding: 10px 11px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
.acc tr:last-child td { border-bottom: none; }
.acc tbody tr:hover { background: var(--surface-2); }
/* 健康色条用真实单元格实现：伪元素会被浏览器当匿名单元格插到行首，整行与表头错列 */
.acc .mark { width: 3px; min-width: 3px; padding: 0; }
.acc .mark i { display: block; width: 3px; height: 100%; min-height: 38px; background: transparent; }
.acc tbody tr.cool .mark i { background: var(--warn); }
.acc tbody tr.off .mark i { background: var(--bad); }
.acc .who { font-weight: 600; }
.acc .who .id { font: 10.5px var(--mono); color: var(--ink-3); margin-top: 2px; }
.acc .ops { text-align: right; white-space: nowrap; }
.acc .ops button + button { margin-left: 4px; }

.keys { display: flex; flex-direction: column; gap: 4px; }
.kchip {
  display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--ink-2); white-space: nowrap;
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 5px;
  padding: 2px 6px; width: fit-content; max-width: 100%;
}
.kchip .cd { color: var(--warn); font-variant-numeric: tabular-nums; }
.kchip button { border: 0; background: transparent; color: var(--ink-3); font: 11px var(--sans); padding: 0 2px; }
.kchip button:hover { color: var(--accent); border: 0; }

/* 分页 */
.pager { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-top: 1px solid var(--line-soft); }
.pager .grow { flex: 1; }
.pager .info { font: 12px var(--mono); color: var(--ink-3); white-space: nowrap; }
.pager button { padding: 4px 10px; font-size: 12.5px; }

/* 空态 */
.empty { padding: 34px 16px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.empty .t { color: var(--ink-2); font-weight: 600; font-size: 13px; margin-bottom: 5px; }

/* 用量条 */
.bar { display: flex; height: 5px; border-radius: 3px; overflow: hidden; background: var(--line); min-width: 60px; }
.bar i { display: block; height: 100%; background: var(--accent); }
.bar i.warn { background: var(--warn); }

/* 保存条：贴底常驻，有未保存改动时提示 */
.savebar {
  position: sticky; bottom: 0; z-index: 15; display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; margin: 0 -24px -60px; border-top: 1px solid var(--line);
  background: color-mix(in srgb, var(--surface) 92%, transparent);
  backdrop-filter: blur(8px);
}
.savebar .grow { flex: 1; }
.savebar .dirty-note { font-size: 12.5px; color: var(--warn); }

/* ── 弹层 ─────────────────────────────────────────────────────────── */
.veil { position: fixed; inset: 0; background: rgba(6,8,13,.55); backdrop-filter: blur(2px); display: none; z-index: 60; padding: 20px; overflow: auto; }
.veil.on { display: flex; align-items: flex-start; justify-content: center; }
.dlg {
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  width: 560px; max-width: 100%; margin: auto; box-shadow: 0 24px 64px -24px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.dlg header { padding: 16px 19px 12px; border-bottom: 1px solid var(--line-soft); }
.dlg header h2 { font-size: 15px; font-weight: 620; }
.dlg header .hint { margin-top: 5px; }
.dlg .body { padding: 16px 19px; }
.dlg footer { padding: 12px 19px; border-top: 1px solid var(--line-soft); display: flex; gap: 9px; align-items: center; }
.dlg .tabs { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 3px; margin-top: 11px; }
.dlg .tabs .tab { padding: 4px 14px; border-radius: 7px; border: none; background: transparent; color: var(--ink-3); font-size: 12.5px; font-weight: 550; }
.dlg .tabs .tab.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.16); }
.url {
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: 10px 12px; font: 11.5px var(--mono); word-break: break-all; color: var(--accent);
  user-select: all; margin: 8px 0 12px;
}
.progress { height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.progress i { display: block; height: 100%; width: 30%; background: var(--accent); animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.state { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
.state.ok { color: var(--ok); }
.state.bad { color: var(--bad); }
pre.out {
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: 11px 12px; font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  max-height: 320px; overflow: auto;
}
code.inline { font: 11.5px var(--mono); background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 5px; padding: 1px 5px; }

/* ── Toast 栈 ─────────────────────────────────────────────────────── */
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.tst {
  background: var(--raise); border: 1px solid var(--line); border-left: 3px solid var(--ink-3);
  border-radius: 8px; padding: 9px 14px; font-size: 12.5px; box-shadow: var(--shadow);
  max-width: 380px; animation: rise .16s ease;
}
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.tst.ok { border-left-color: var(--ok); }
.tst.bad { border-left-color: var(--bad); }
.tst.warn { border-left-color: var(--warn); }

/* ── 登录 ─────────────────────────────────────────────────────────── */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login .card {
  width: 360px; max-width: 100%; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 26px 24px; box-shadow: var(--shadow);
}
.login .mark { width: 38px; height: 38px; display: block; margin-bottom: 14px; }
.login h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.login p { color: var(--ink-3); font-size: 12.5px; margin: 4px 0 18px; }
.login .err { color: var(--bad); font-size: 12px; min-height: 18px; margin-top: 8px; }

/* 汉堡与抽屉遮罩：桌面端不渲染 */
.nav-btn, .nav-veil { display: none; }

/* ── 窄屏 ─────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .shell { grid-template-columns: 1fr; }
  .nav {
    position: fixed; top: 0; left: 0; bottom: 0; width: 244px; max-width: 84vw; height: 100%;
    transform: translateX(-100%); transition: transform .22s ease; box-shadow: 0 0 40px rgba(0,0,0,.35);
  }
  .nav.open { transform: translateX(0); }
  .nav-btn { display: inline-grid; }
  .nav-veil { display: none; position: fixed; inset: 0; background: rgba(6,8,13,.45); z-index: 35; }
  .nav-veil.on { display: block; }
  .topbar { padding: 11px 14px; gap: 9px; }
  .topbar .meta { display: none; }
  .topbar .sep { display: none; }
  .view { padding: 14px 14px 40px; }
  .stats { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .savebar { margin: 0 -14px -40px; }
  .acc { min-width: 720px; }
  .acc .opt { display: none; }
}
@media (max-width: 520px) {
  .topbar h2 { font-size: 14.5px; }
  .chips .chip { font-size: 11.5px; }
}
</style>
</head>
<body>

<!-- ══ 登录 ══════════════════════════════════════════════════════════ -->
<div class="login" id="login">
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b7cfa"/><path d="M9 20.5v-9l7 5.5 7-5.5v9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <h1>meoo2api</h1>
    <p>秒悟 Meoo 的 OpenAI 兼容网关</p>
    <label class="fld"><span class="lb">管理密码</span>
      <input id="pw" type="password" autocomplete="current-password" placeholder="首次启动时控制台打印的密码"></label>
    <button class="primary" style="width:100%;justify-content:center" onclick="doLogin(this)">登录</button>
    <div class="err" id="loginErr"></div>
    <div style="display:flex;align-items:center;gap:8px;margin-top:14px">
      <span class="hint" id="loginVer">—</span><span class="grow"></span>
      <button class="xs ghost" id="loginTheme" onclick="cycleTheme()">主题：自动</button>
    </div>
  </div>
</div>

<!-- ══ 主壳 ══════════════════════════════════════════════════════════ -->
<div class="shell" id="app" hidden>
  <nav class="nav" id="navDrawer">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b7cfa"/><path d="M9 20.5v-9l7 5.5 7-5.5v9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div>
        <div class="name">meoo2api</div>
        <div class="sub" id="navSub">控制台</div>
      </div>
    </div>
    <ul id="navList">
      <li class="nav-h first">运营</li>
      <li class="nav-i"><a data-view="accounts" class="on" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="5.5" r="2.5"/><path d="M3 13.3c.7-2.6 2.7-3.9 5-3.9s4.3 1.3 5 3.9"/></svg>
        账号池<span class="badge" id="navAcc">0</span></a></li>
      <li class="nav-i"><a data-view="keys" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="8" r="2.8"/><path d="M8.8 8H14M12 8v2.2M10 8v1.6"/></svg>
        凭证<span class="badge" id="navKey">0</span></a></li>
      <li class="nav-h">观测</li>
      <li class="nav-i"><a data-view="usage" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 13.4h10.8"/><path d="M4.9 13.4V8.7M8 13.4V4.4M11.1 13.4v-3.2"/></svg>
        用量</a></li>
      <li class="nav-h">配置</li>
      <li class="nav-i"><a data-view="models" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 1.9l5.2 2.9v6.3L8 14.1 2.8 11.1V4.8z"/><path d="M2.8 4.8L8 7.7l5.2-2.9M8 7.7v6.4"/></svg>
        模型与别名</a></li>
      <li class="nav-i"><a data-view="config" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M2.6 5.4h10.8M2.6 10.6h10.8"/><circle cx="6" cy="5.4" r="1.7"/><circle cx="10" cy="10.6" r="1.7"/></svg>
        配置</a></li>
      <li class="nav-i"><a data-view="logs" tabindex="0">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2.2" y="2.9" width="11.6" height="10.2" rx="1.7"/><path d="M5.1 6.4l1.9 1.7-1.9 1.7M8.7 10.1h2.5"/></svg>
        运行日志</a></li>
    </ul>
    <div class="sig">
      <div class="row"><span class="pulse" id="navPulse"></span><span id="navState">连接中</span></div>
      <div class="row"><span id="navVer">v-</span> · <span id="navUp">-</span></div>
      <div class="row" style="margin-top:8px"><a onclick="doLogout()" style="cursor:pointer;color:var(--ink-3)">退出登录</a></div>
    </div>
  </nav>

  <button class="nav-veil" id="navVeil" onclick="toggleNav(false)" aria-hidden="true"></button>

  <div class="main">
    <div class="topbar">
      <button class="icon ghost nav-btn" onclick="toggleNav()" aria-label="打开导航">
        <svg viewBox="0 0 16 16" width="16" height="16" fill="none" stroke="currentColor" stroke-linecap="round" stroke-width="1.5"><path d="M2.5 4h11M2.5 8h11M2.5 12h11"/></svg>
      </button>
      <h2 id="ttl">账号池</h2>
      <span class="sep">/</span>
      <span class="meta" id="subMeta">—</span>
      <div class="grow"></div>
      <button class="icon ghost" id="btnTheme" onclick="cycleTheme()" title="切换明暗（跟随系统 → 浅色 → 深色）" aria-label="切换主题">
        <svg viewBox="0 0 16 16" width="15" height="15" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5"><path d="M13.2 9.6A5.6 5.6 0 0 1 6.4 2.8a5.6 5.6 0 1 0 6.8 6.8z"/></svg>
      </button>
      <button onclick="load(true)">刷新</button>
      <button class="primary" id="btnPrimary" onclick="primaryAction()">添加账号</button>
    </div>
    <section class="view" id="view"></section>
  </div>
</div>

<div id="modalHost"></div>
<div id="toasts"></div>

<script>
"use strict";

/* ══ 状态 ═════════════════════════════════════════════════════════
   S 是 /admin/api/state 的原样快照，所有视图由它派生；页面不自持第二份真相，
   避免「面板显示」与「服务真实状态」分叉。 */
let S = null;
let view = "accounts";
let timer = null;
let logTimer = null;
let logAuto = true;
let logFilter = { ch: "", status: "" };
let accFilter = "all";
let accQuery = "";
let accSort = { key: "points", dir: -1 };
let accPage = 1;
const PAGE_SIZE = 20;
let devTimer = null;
let VER = "dev";
let UP = "api.meoo.host";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n) => Number(n || 0).toLocaleString("zh-CN");
const hms = (ms) => { if (!ms) return "—"; const d = new Date(ms); return d.toLocaleTimeString("zh-CN", { hour12: false }); };
const ago = (ms) => {
  if (!ms || Number(ms) <= 0) return "从未";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
};
const durSec = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + "h" + m + "m" : m ? m + "m" : s + "s";
};

function toast(msg, kind) {
  const el = document.createElement("div");
  el.className = "tst " + (kind || "ok");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (res.status === 401) { showLogin(); throw new Error("未登录"); }
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { throw new Error("响应非 JSON: " + txt.slice(0, 120)); }
  return data;
}

/* ══ 主题 ═════════════════════════════════════════════════════════ */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "自动", light: "浅色", dark: "深色" };
function applyTheme(pref) {
  const dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = pref;
  const lbl = $("#loginTheme");
  if (lbl) lbl.textContent = "主题：" + THEME_LABEL[pref];
}
function cycleTheme() {
  const cur = document.documentElement.dataset.pref || "auto";
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  try { localStorage.setItem("meoo.theme", next); } catch (e) {}
  applyTheme(next);
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if ((document.documentElement.dataset.pref || "auto") === "auto") applyTheme("auto");
});

/* ══ 登录 ═════════════════════════════════════════════════════════ */
function showLogin() {
  $("#login").style.display = "grid";
  $("#app").hidden = true;
  if (timer) { clearInterval(timer); timer = null; }
  if (logTimer) { clearInterval(logTimer); logTimer = null; }
}
function showApp() { $("#login").style.display = "none"; $("#app").hidden = false; }

async function doLogin(btn) {
  $("#loginErr").textContent = "";
  if (btn) btn.disabled = true;
  try {
    const r = await api("/admin/api/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    if (r.ok) { $("#pw").value = ""; showApp(); await load(); }
    else $("#loginErr").textContent = r.error || "登录失败";
  } catch (e) { $("#loginErr").textContent = e.message; }
  if (btn) btn.disabled = false;
}
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogout() {
  try { await api("/admin/api/logout", { method: "POST" }); } catch (e) {}
  S = null; showLogin();
}

/* ══ 导航 ═════════════════════════════════════════════════════════ */
const VIEWS = {
  accounts: { title: "账号池", primary: "添加账号", action: () => openAddAccount() },
  keys: { title: "凭证", primary: "签发密钥", action: () => createClientKey() },
  usage: { title: "用量", primary: "采样积分", action: (btn) => sampleCost(btn) },
  models: { title: "模型与别名", primary: "同步目录", action: (btn) => refreshCatalog(btn) },
  config: { title: "配置", primary: null },
  logs: { title: "运行日志", primary: null },
};
function goto(v) {
  if (!VIEWS[v]) return;
  view = v;
  document.querySelectorAll("#navList a").forEach((a) => a.classList.toggle("on", a.dataset.view === v));
  toggleNav(false);
  render();
}
$("#navList").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-view]");
  if (a) { e.preventDefault(); goto(a.dataset.view); }
});
$("#navList").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const a = e.target.closest("a[data-view]");
  if (a) { e.preventDefault(); goto(a.dataset.view); }
});
function toggleNav(force) {
  const n = $("#navDrawer"), veil = $("#navVeil");
  const open = force === undefined ? !n.classList.contains("open") : force;
  n.classList.toggle("open", open);
  veil.classList.toggle("on", open);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); toggleNav(false); }
});
function primaryAction(btn) {
  const v = VIEWS[view];
  if (v && v.action) v.action(btn || $("#btnPrimary"));
}

/* ══ 载入 ═════════════════════════════════════════════════════════ */
async function load(silent) {
  try {
    const r = await api("/admin/api/state");
    if (!r || !r.ok) throw new Error((r && r.error) || "读取状态失败");
    S = r;
    showApp();
    renderChrome();
    render();
    if (!timer) timer = setInterval(tick, 10000);
  } catch (e) {
    if (String(e.message).indexOf("未登录") >= 0) return;
    if (!silent) toast(e.message, "bad");
  }
}

function collectKeys() {
  const out = [], seen = new Set();
  (S.accounts || []).forEach((a) => (a.keys || []).forEach((k) => { if (!seen.has(k.id)) { seen.add(k.id); out.push(k); } }));
  (S.orphan_keys || []).forEach((k) => { if (!seen.has(k.id)) { seen.add(k.id); out.push(k); } });
  return out;
}
function poolStats() {
  const accs = S.accounts || [];
  const keys = collectKeys();
  const ok = keys.filter((k) => k.enabled && k.state === "ok").length;
  const cooling = keys.filter((k) => k.state !== "ok" && k.state !== "invalid" && k.cooldown_sec > 0).length;
  const bad = keys.filter((k) => k.state === "invalid").length;
  const off = accs.filter((a) => !a.enabled).length;
  const points = accs.reduce((s, a) => s + (a.points || 0), 0);
  return { accs, keys, ok, cooling, bad, off, points, usable: S.usable || 0 };
}

function renderChrome() {
  const ps = poolStats();
  const st = S.stats || {};
  $("#navPulse").className = "pulse " + (ps.usable > 0 ? "" : "bad");
  $("#navState").textContent = ps.usable > 0 ? "上游可用" : "无可用凭证";
  $("#navVer").textContent = "v" + VER.replace(/^v/, "");
  $("#navUp").textContent = UP;
  $("#navAcc").textContent = String(ps.accs.length);
  $("#navKey").textContent = String(ps.keys.length);
  $("#navKey").className = "badge" + (ps.ok === 0 ? " bad" : "");
  $("#navSub").textContent = ps.usable > 0 ? "运行中" : "待接入";

  const v = VIEWS[view] || VIEWS.accounts;
  $("#ttl").textContent = v.title;
  $("#subMeta").textContent = view === "accounts"
    ? ps.usable + " 可用 / " + ps.keys.length + " 凭证 · 成功率 " + (st.success_rate || 0).toFixed(1) + "%"
    : view === "logs" ? "元数据 · 不落正文"
    : view === "usage" ? "按模型累计 · " + nf(st.tokens) + " tokens"
    : view === "models" ? ((S.catalog && S.catalog.status && S.catalog.status.count) || 0) + " 个上游模型"
    : view === "keys" ? (S.client_keys || []).length + " 个客户端密钥"
    : "保存后立即生效";
  const pb = $("#btnPrimary");
  if (v.primary) { pb.hidden = false; pb.textContent = v.primary; }
  else pb.hidden = true;
}

function render() {
  if (!S) return;
  renderChrome();
  const el = $("#view");
  if (view === "accounts") el.innerHTML = viewAccounts();
  else if (view === "keys") el.innerHTML = viewKeys();
  else if (view === "usage") el.innerHTML = viewUsage();
  else if (view === "models") el.innerHTML = viewModels();
  else if (view === "config") el.innerHTML = viewConfig();
  else if (view === "logs") el.innerHTML = viewLogs();
  tick();
  if (view === "logs") { loadLogs(); armLogTimer(); } else if (logTimer) { clearInterval(logTimer); logTimer = null; }
  if (view === "config") armDirtyWatch();
}

/* ══ 账号池 ═══════════════════════════════════════════════════════ */
function viewAccounts() {
  const ps = poolStats();
  const st = S.stats || {};
  const list = ps.accs.filter(accMatches).sort(accCompare);
  const pages = Math.max(1, Math.ceil(list.length / PAGE_SIZE));
  if (accPage > pages) accPage = pages;
  const slice = list.slice((accPage - 1) * PAGE_SIZE, accPage * PAGE_SIZE);
  const countBy = (cls) => ps.accs.filter((a) => accHealth(a).cls === cls).length;

  return `
  <div class="stats">
    <div class="stat ${ps.accs.length ? "" : "bad"}"><div class="v">${ps.accs.length}</div><div class="k">账号总数</div></div>
    <div class="stat ${ps.ok ? "good" : "bad"}"><div class="v">${ps.ok}<small>/ ${ps.keys.length}</small></div><div class="k">可用凭证</div></div>
    <div class="stat ${ps.cooling ? "warn" : ""}"><div class="v">${ps.cooling}</div><div class="k">冷却中</div></div>
    <div class="stat ${ps.bad ? "bad" : ""}"><div class="v">${ps.bad}</div><div class="k">已失效</div></div>
    <div class="stat hl"><div class="v">${nf(ps.points)}</div><div class="k">积分剩余</div></div>
    <div class="stat"><div class="v">${nf(st.tokens)}</div><div class="k">累计 tokens</div></div>
  </div>

  ${(ps.cooling || ps.bad || ps.off) ? `<div style="display:flex;align-items:center;gap:10px;padding:10px 14px;margin-bottom:14px;background:var(--surface);border:1px solid var(--line);border-radius:9px;box-shadow:inset 3px 0 var(--${ps.bad ? "bad" : "warn"})">
    <span class="pulse ${ps.bad ? "bad" : "warn"}"></span>
    <b style="font-size:13px">${ps.bad ? "有凭证失效，相关账号当前不可用" : ps.off ? "有账号被停用" : "部分凭证冷却中，请求会绕行"}</b>
    <span class="grow"></span>
    <span class="chips">
      ${ps.cooling ? `<span class="chip" onclick="setAccFilter('cooling')">冷却<span class="n">${ps.cooling}</span></span>` : ""}
      ${ps.bad ? `<span class="chip" onclick="setAccFilter('invalid')">失效<span class="n">${ps.bad}</span></span>` : ""}
      ${ps.off ? `<span class="chip" onclick="setAccFilter('off')">停用<span class="n">${ps.off}</span></span>` : ""}
    </span>
  </div>` : ""}

  <div class="box">
    <header>
      <h3>账号池<span class="hint">在途请求数最少优先选号；失败自动换号</span></h3>
      <span class="grow"></span>
      <button class="xs" onclick="openAddKey()">手动加项目 AK</button>
      <button class="xs" onclick="openDebug()">在线调试</button>
    </header>
    <div class="pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line-soft);padding:10px 14px">
      <input id="accQ" type="text" placeholder="搜索备注 / user_id / 项目" value="${esc(accQuery)}"
             oninput="accQuery=this.value;accPage=1;refreshList()" style="width:230px">
      <span class="chips">
        ${[["all", "全部", ps.accs.length], ["ok", "可用", countBy("ok")], ["cooling", "冷却", countBy("warn")],
           ["invalid", "失效", countBy("bad")], ["off", "停用", ps.off]]
          .map(([v, t, n]) => `<span class="chip ${accFilter === v ? "on" : ""}" onclick="setAccFilter('${v}')">${t}<span class="n">${n}</span></span>`).join("")}
      </span>
      <span class="grow"></span>
      <span class="note">${list.length === ps.accs.length ? "" : "筛出 " + list.length + " / " + ps.accs.length}</span>
    </div>
    <div class="tbl-wrap">
      <table class="acc wide">
        <thead><tr>
          <th class="mark" aria-hidden="true"></th>
          <th class="sortable" onclick="sortAcc('label')">账号${sortArrow("label")}</th>
          <th class="sortable opt" onclick="sortAcc('project_id')">项目 / AK${sortArrow("project_id")}</th>
          <th class="sortable" onclick="sortAcc('points')">积分${sortArrow("points")}</th>
          <th>凭证</th>
          <th>状态</th>
          <th class="ops">操作</th>
        </tr></thead>
        <tbody>${slice.length ? slice.map(accRow).join("") : emptyRow(7, ps.accs.length ? "没有匹配的账号" : "号池还是空的",
          ps.accs.length ? "换个筛选条件试试" : "点右上「添加账号」：浏览器授权一次，或粘一段 Cookie 免浏览器接入")}
        </tbody>
      </table>
    </div>
    ${list.length > PAGE_SIZE ? `<div class="pager">
      <span class="info">第 ${accPage} / ${pages} 页 · 共 ${list.length} 条</span>
      <span class="grow"></span>
      <button class="xs" ${accPage <= 1 ? "disabled" : ""} onclick="accPage--;refreshList()">上一页</button>
      <button class="xs" ${accPage >= pages ? "disabled" : ""} onclick="accPage++;refreshList()">下一页</button>
    </div>` : ""}
  </div>`;
}

function emptyRow(cols, title, desc) {
  return `<tr><td colspan="${cols}"><div class="empty"><div class="t">${esc(title)}</div>${desc}</div></td></tr>`;
}

function accHealth(a) {
  const keys = a.keys || [];
  if (!a.enabled) return { cls: "off", text: "已停用" };
  if (!keys.length) return { cls: "mute", text: "无凭证" };
  const ok = keys.filter((k) => k.enabled && k.state === "ok").length;
  if (ok > 0) return { cls: "ok", text: ok + " 可用" };
  if (keys.some((k) => k.state === "invalid")) return { cls: "bad", text: "凭证失效" };
  return { cls: "warn", text: "冷却中" };
}

function accMatches(a) {
  if (accFilter !== "all") {
    const map = { ok: "ok", cooling: "warn", invalid: "bad", off: "off" };
    if (accHealth(a).cls !== map[accFilter]) return false;
  }
  if (!accQuery) return true;
  const q = accQuery.toLowerCase();
  return [a.label, a.name, a.user_id, a.project_id].some((v) => String(v || "").toLowerCase().includes(q));
}
function accCompare(x, y) {
  const k = accSort.key;
  const a = k === "label" ? (x.label || x.name || "") : k === "project_id" ? (x.project_id || "") : (x[k] || 0);
  const b = k === "label" ? (y.label || y.name || "") : k === "project_id" ? (y.project_id || "") : (y[k] || 0);
  if (typeof a === "string" || typeof b === "string") return String(a).localeCompare(String(b), "zh") * accSort.dir;
  return (a - b) * accSort.dir;
}
function sortAcc(key) {
  if (accSort.key === key) accSort.dir *= -1;
  else accSort = { key, dir: key === "points" ? -1 : 1 };
  refreshList();
}
function sortArrow(key) {
  return accSort.key === key ? `<span class="arrow">${accSort.dir > 0 ? "▲" : "▼"}</span>` : "";
}
function setAccFilter(v) { accFilter = v; accPage = 1; refreshList(); }
/* 局部刷新：只重画账号视图，重新聚焦搜索框，避免整页闪一下丢焦点 */
function refreshList() {
  if (view !== "accounts") { render(); return; }
  const el = $("#view");
  const q = accQuery;
  const focused = document.activeElement && document.activeElement.id === "accQ";
  el.innerHTML = viewAccounts();
  const inp = $("#accQ");
  if (inp && focused) { inp.focus(); inp.setSelectionRange(q.length, q.length); }
  tick();
}

function accRow(a) {
  const keys = a.keys || [];
  const h = accHealth(a);
  const cost = a.cost || {};
  return `<tr class="${h.cls === "warn" ? "cool" : h.cls === "off" || h.cls === "bad" ? "off" : ""}">
    <td class="mark"><i></i></td>
    <td>
      <div class="who">${esc(a.label || a.name || "未命名")}</div>
      <div class="id mono">${esc(a.user_id || "—")}</div>
    </td>
    <td class="opt nw">
      <div class="mono" style="font-size:11.5px">${esc(a.project_id || "—")}</div>
      <div class="hint mono">${a.has_personal_ak ? esc(a.personal_ak) : "个人 AK 未绑定"}</div>
    </td>
    <td>
      <div class="num">${nf(a.points)}<span class="hint" style="margin-left:5px">${ago(a.points_at)}</span></div>
      ${cost.spent ? `<div class="hint">已花 ${nf(cost.spent)} 分${cost.tokens_per_credit ? " · ≈" + nf(cost.tokens_per_credit) + " tok/分" : ""}</div>` : ""}
    </td>
    <td>
      <div class="keys">${keys.length ? keys.map((k) => `
        <span class="kchip">

/* ══ 用量 ═════════════════════════════════════════════════════════ */
function viewUsage() {
  const accs = S.accounts || [];
  const st = S.stats || {};
  const rows = [];
  let spent = 0, tokens = 0, lastSample = 0;
  accs.forEach((a) => {
    const c = a.cost || {};
    spent += c.spent || 0;
    tokens += c.tokens || 0;
    lastSample = Math.max(lastSample, c.last_sample_at || 0);
    Object.entries(c.per_model || {}).forEach(([m, v]) => {
      const hit = rows.find((r) => r.model === m);
      if (hit) { hit.tokens += v.tokens || 0; hit.cost += v.cost || 0; }
      else rows.push({ model: m, tokens: v.tokens || 0, cost: v.cost || 0 });
    });
  });
  rows.sort((a, b) => b.tokens - a.tokens);
  const maxTok = rows.length ? rows[0].tokens : 1;
  const rate = spent > 0 ? Math.round(tokens / spent) : 0;

  return `
  <div class="stats">
    <div class="stat"><div class="v">${nf(st.tokens)}</div><div class="k">网关累计 tokens</div></div>
    <div class="stat"><div class="v">${nf(tokens)}</div><div class="k">采样覆盖 tokens</div></div>
    <div class="stat warn"><div class="v">${nf(spent)}<small> 分</small></div><div class="k">已花积分</div></div>
    <div class="stat hl"><div class="v">${rate ? nf(rate) : "—"}</div><div class="k">tok / 分（实测）</div></div>
    <div class="stat"><div class="v">${nf(st.chat_ok)}<small>/ ${nf(st.chat_err)}</small></div><div class="k">成功 / 失败</div></div>
    <div class="stat"><div class="v">${nf(st.avg_ttfb_ms)}<small> ms</small></div><div class="k">平均首字节</div></div>
  </div>

  <div class="box">
    <header><h3>按模型用量<span class="hint">成本按采样窗口内 token 占比分摊（估算）</span></h3>
      <span class="grow"></span><span class="note">上次采样 ${ago(lastSample)}</span></header>
    <div class="tbl-wrap">
      <table class="acc" style="min-width:640px">
        <thead><tr><th>模型</th><th style="width:32%">token 占比</th><th>tokens</th><th>折算成本</th><th class="opt">tok/分</th></tr></thead>
        <tbody>${rows.length ? rows.map((r) => `
          <tr>
            <td class="mono">${esc(r.model)}</td>
            <td><div class="bar"><i class="${r.model.includes("glm") ? "warn" : ""}" style="width:${Math.max(2, Math.round(r.tokens / maxTok * 100))}%"></i></div></td>
            <td class="num">${nf(r.tokens)}</td>
            <td class="num">${nf(Math.round(r.cost))} 分</td>
            <td class="num opt">${r.cost > 0 ? nf(Math.round(r.tokens / r.cost)) : "—"}</td>
          </tr>`).join("") : emptyRow(5, "还没有用量样本", "打几次对话后点「采样积分」，或等 5 分钟自动采样")}
        </tbody>
      </table>
    </div>
    <div class="foot">
      <span class="hint">积分入账有延迟（几秒~十几秒）；整数精度，小额请求测不出消耗 —— 采样要用 ~10k tokens 的请求。</span>
      <span class="grow"></span>
      <button class="xs" onclick="sampleCost(this)">立即采样</button>
    </div>
  </div>`;
}

/* ══ 模型与别名 ═══════════════════════════════════════════════════
   三块：新增别名（表单）→ 别名表（可删）→ 内置模型（可隐藏）。
   写入都走 POST /admin/api/config 的局部字段，不新增接口。 */
function aliasState() {
  const aliases = (S.config && S.config.aliases) || {};
  const notes = (S.config && S.config.alias_notes) || {};
  const hidden = new Set((S.config && S.config.hidden_models) || []);
  const models = S.models || [];
  const upstream = models.filter((m) => !aliases[m.id]).map((m) => m.id);
  const usage = {};
  (S.accounts || []).forEach((a) => Object.entries((a.cost && a.cost.per_model) || {}).forEach(([m, v]) => {
    usage[m] = (usage[m] || 0) + (v.tokens || 0);
  }));
  return { aliases, notes, hidden, models, upstream, usage };
}

function viewModels() {
  const st = aliasState();
  const cat = (S.catalog && S.catalog.status) || {};
  const aliasRows = Object.entries(st.aliases);
  // 隐藏的模型不在 state.models 里（catalog.List 已过滤），单独补出来才能取消隐藏
  const hiddenRows = [...st.hidden].filter((id) => !st.aliases[id]).map((id) => ({ id, hidden: true }));
  const visibleRows = st.models.filter((m) => !st.aliases[m.id]).map((m) => ({ id: m.id, hidden: false }));
  const modelRows = visibleRows.concat(hiddenRows);

  return `
  <div class="box">
    <header><h3>新增别名<span class="hint">请求名 → 上游模型</span></h3>
      <span class="grow"></span><span class="note">请求名不区分大小写</span></header>
    <div class="pad">
      <div style="display:grid;grid-template-columns:minmax(160px,1fr) minmax(180px,1.2fr) minmax(120px,.8fr) auto;gap:10px;align-items:end">
        <label class="fld" style="margin:0"><span class="lb">客户端请求名</span>
          <input id="alName" type="text" class="mono" placeholder="例如 qwen"></label>
        <label class="fld" style="margin:0"><span class="lb">指向模型</span>
          <select id="alTarget" class="mono">${st.upstream.length
            ? st.upstream.map((id) => `<option value="${esc(id)}">${esc(id)}</option>`).join("")
            : `<option value="">（目录为空，先同步）</option>`}</select></label>
        <label class="fld" style="margin:0"><span class="lb">备注<span class="hint">（可选）</span></span>
          <input id="alNote" type="text" placeholder="例如 客户端默认"></label>
        <button class="primary" onclick="addAlias(this)" ${st.upstream.length ? "" : "disabled"}>添加</button>
      </div>
      <div class="hint" style="margin-top:10px">别名优先于上游模型名解析：客户端请求 <code class="inline">qwen</code> 时网关直接换成右侧模型，上游看到的只有真实模型名。</div>
    </div>
  </div>

  <div class="box">
    <header><h3>别名</h3><span class="grow"></span><span class="note">${aliasRows.length} 条</span></header>
    <div class="tbl-wrap">
      <table class="acc" style="min-width:720px">
        <thead><tr><th>请求名</th><th>指向模型</th><th>上游是否存在</th><th class="opt">本机用量</th><th>备注</th><th class="ops"></th></tr></thead>
        <tbody>${aliasRows.length ? aliasRows.map(([k, v]) => `
          <tr>
            <td class="mono nw">${esc(k)}</td>
            <td class="mono nw">${esc(v)}</td>
            <td>${st.models.some((m) => m.id === v) || st.hidden.has(v)
              ? '<span class="tag ok">是</span>'
              : '<span class="tag bad">否 · 请求会 404</span>'}</td>
            <td class="num opt">${st.usage[v] ? nf(st.usage[v]) : "—"}</td>
            <td class="hint">${esc(st.notes[k] || "—")}</td>
            <td class="ops"><button class="xs ghost danger" onclick="delAlias('${esc(k)}')">删除</button></td>
          </tr>`).join("") : emptyRow(6, "还没有别名", "在上面的表单里填一个请求名，选一个上游模型")}
        </tbody>
      </table>
    </div>
  </div>

  <div class="box">
    <header><h3>内置模型<span class="hint">勾「隐藏」后 /v1/models 与别名下拉里都不再出现</span></h3>
      <span class="grow"></span>
      <span class="note">${(cat.count || 0) === 0 ? "尚未同步" : (cat.source === "stale" ? "过期缓存" : "实时同步") + " · " + cat.count + " 个 · " + ago(cat.fetched_at)}</span>
      <button class="xs" onclick="refreshCatalog(this)">同步</button>
    </header>
    <div class="tbl-wrap">
      <table class="acc" style="min-width:560px">
        <thead><tr><th>模型 ID</th><th class="opt">本机用量</th><th style="width:88px">隐藏</th></tr></thead>
        <tbody>${modelRows.length ? modelRows.map((m) => `
          <tr>
            <td class="mono nw">${esc(m.id)}${m.hidden ? ' <span class="tag mute">已隐藏</span>' : ""}</td>
            <td class="num opt">${st.usage[m.id] ? nf(st.usage[m.id]) : "—"}</td>
            <td><input type="checkbox" ${m.hidden ? "checked" : ""} onchange="toggleHidden('${esc(m.id)}',this.checked)" style="width:auto"></td>
          </tr>`).join("") : emptyRow(3, "目录为空", "至少需要一个可用凭证才能同步上游模型")}
        </tbody>
      </table>
    </div>
    ${cat.error ? `<div class="foot"><span class="hint" style="color:var(--bad)">${esc(cat.error)}</span></div>` : ""}
  </div>`;
}

/* 统一的别名/隐藏写入：只提交变化的字段，别把整份 config 覆盖回去 */
async function saveAliasState(aliases, notes, okMsg) {
  const r = await api("/admin/api/config", { method: "POST", body: JSON.stringify({ aliases, alias_notes: notes }) });
  if (!r.ok) { toast(r.error || "保存失败", "bad"); return false; }
  await load(true);
  if (okMsg) toast(okMsg);
  return true;
}

async function addAlias(btn) {
  const name = ($("#alName").value || "").trim().toLowerCase();
  const target = ($("#alTarget").value || "").trim();
  const note = ($("#alNote").value || "").trim();
  if (!name) { toast("请填客户端请求名", "bad"); return; }
  if (!/^[a-z0-9][a-z0-9._-]*$/.test(name)) { toast("请求名只能用字母/数字和 . _ -，且以字母或数字开头", "bad"); return; }
  if (!target) { toast("没有可选的上游模型，先同步目录", "bad"); return; }
  const st = aliasState();
  if (st.aliases[name]) { toast("别名 " + name + " 已存在，先删掉再改", "bad"); return; }
  if (st.models.some((m) => m.id === name) || st.hidden.has(name)) {
    toast("请求名与内置模型同名，会盖掉真实模型", "bad"); return;
  }
  if (btn) { btn.disabled = true; btn.textContent = "保存中"; }
  const aliases = Object.assign({}, st.aliases, { [name]: target });
  const notes = Object.assign({}, st.notes);
  if (note) notes[name] = note;
  await saveAliasState(aliases, notes, "已添加别名 " + name + " → " + target);
  if (btn) { btn.disabled = false; btn.textContent = "添加"; }
}

async function delAlias(name) {
  if (!confirm("删除别名「" + name + "」？\n之后客户端再用这个请求名会直接透传给上游。")) return;
  const st = aliasState();
  const aliases = Object.assign({}, st.aliases);
  delete aliases[name];
  const notes = Object.assign({}, st.notes);
  delete notes[name];
  await saveAliasState(aliases, notes, "已删除别名 " + name);
}

async function toggleHidden(id, hide) {
  const st = aliasState();
  const list = new Set(st.hidden);
  if (hide) list.add(id); else list.delete(id);
  const r = await api("/admin/api/config", { method: "POST", body: JSON.stringify({ hidden_models: [...list] }) });
  if (!r.ok) { toast(r.error || "保存失败", "bad"); return; }
  await load(true);
  toast(hide ? "已隐藏 " + id : "已恢复 " + id);
}

async function refreshCatalog(btn) {
  const old = btn ? btn.textContent : "同步";
  if (btn) { btn.disabled = true; btn.textContent = "同步中"; }
  try { await api("/admin/api/catalog/refresh", { method: "POST" }); await load(true); toast("模型目录已刷新"); }
  catch (e) { toast(e.message, "bad"); }
  if (btn) { btn.disabled = false; btn.textContent = old; }
}

    </div>
  </div>

    <header><h3>模型别名</h3><span class="grow"></span><span class="note">每行一个 别名=上游模型ID</span></header>
    <div class="pad">

      <div class="hint" style="margin-top:8px">别名让客户端用短名字请求；上游真实模型见「模型与别名」页。</div>

      <button class="xs" onclick="saveConfig(this, true)">只改密码</button>
    </div>
  </div>

  <div class="savebar">
    <span class="dirty-note" id="dirtyNote" hidden>有未保存的改动</span>
    <span class="grow"></span>
    <button class="xs ghost" onclick="render()">放弃改动</button>
    <button class="xs primary" onclick="saveConfig(this)">保存并生效</button>

function armDirtyWatch() {
  const note = $("#dirtyNote");
  const mark = () => { if (note) note.hidden = false; };
  ["cMax", "cTimeout", "cQuota", "cRate", "cKeep", "cAliases", "cFailover"].forEach((id) => {
    const el = $("#" + id);
    if (el) { el.addEventListener("input", mark); el.addEventListener("change", mark); }
  });
}

async function saveConfig(btn, withPassword) {
  const old = btn ? btn.textContent : "保存";
  if (btn) { btn.disabled = true; btn.textContent = "保存中"; }
  try {
    const body = {};
    if (withPassword) {
      const pw = $("#cPw").value;
      if (!pw) { toast("请输入新密码", "bad"); if (btn) { btn.disabled = false; btn.textContent = old; } return; }
      body.new_password = pw;
    } else {
      const aliases = {};
      ($("#cAliases").value || "").split("\n").forEach((line) => {
        const i = line.indexOf("=");
        if (i > 0) aliases[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
      });
      Object.assign(body, {
        default_max_tokens: Number($("#cMax").value || 0),
        request_timeout_sec: Number($("#cTimeout").value || 180),
        quota_cooldown_sec: Number($("#cQuota").value || 0),
        rate_cooldown_sec: Number($("#cRate").value || 0),
        keepalive_sec: Number($("#cKeep").value || 0),
        failover: $("#cFailover").checked,
        aliases,
      });
    }
    const r = await api("/admin/api/config", { method: "POST", body: JSON.stringify(body) });
    if (r.ok) { toast("已保存"); await load(true); if (withPassword) { const p = $("#cPw"); if (p) p.value = ""; } }
    else toast(r.error, "bad");
  } catch (e) { toast(e.message, "bad"); }
  if (btn) { btn.disabled = false; btn.textContent = old; }
}

/* ══ 运行日志 ═════════════════════════════════════════════════════ */
function viewLogs() {
  return `
  <div class="box">
    <header><h3>请求日志<span class="hint">最近 200 条元数据</span></h3>
      <span class="grow"></span>
      <label style="display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--ink-2);cursor:pointer">
        <input type="checkbox" ${logAuto ? "checked" : ""} onchange="logAuto=this.checked;armLogTimer();render()"> 自动刷新
      </label>
      <button class="xs" onclick="loadLogs()">刷新</button>
    </header>
    <div class="pad" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line-soft);padding:10px 14px">
      <span class="chips" id="chCh">
        <span class="chip ${logFilter.ch === "" ? "on" : ""}" onclick="setLogFilter('ch','')">全部频道</span>
        <span class="chip ${logFilter.ch === "chat" ? "on" : ""}" onclick="setLogFilter('ch','chat')">对话</span>
      </span>
      <span class="chips" id="chSt">
        <span class="chip ${logFilter.status === "" ? "on" : ""}" onclick="setLogFilter('status','')">全部状态</span>
        <span class="chip ${logFilter.status === "ok" ? "on" : ""}" onclick="setLogFilter('status','ok')">成功</span>
        <span class="chip ${logFilter.status === "err" ? "on" : ""}" onclick="setLogFilter('status','err')">失败</span>
      </span>
      <span class="grow"></span>
      <span class="note">不落提示词与响应正文</span>
    </div>
    <div class="tbl-wrap">
      <table class="acc" style="min-width:860px">
        <thead><tr><th>时间</th><th class="opt">频道</th><th>模型</th><th>状态</th><th class="opt">TTFB</th><th>耗时</th><th class="opt">tokens</th><th>账号 / 备注</th></tr></thead>

}

function setLogFilter(k, v) {
  logFilter[k] = v;
  document.querySelectorAll(k === "ch" ? "#chCh .chip" : "#chSt .chip").forEach((el, i) => {
    const vals = k === "ch" ? ["", "chat"] : ["", "ok", "err"];
    el.classList.toggle("on", vals[i] === v);
  });
  loadLogs();
}

function armLogTimer() {
  if (logTimer) { clearInterval(logTimer); logTimer = null; }
  if (view === "logs" && logAuto) logTimer = setInterval(loadLogs, 5000);
}

async function loadLogs() {
  try {
    const r = await api("/admin/api/logs?ch=" + encodeURIComponent(logFilter.ch) + "&status=" + encodeURIComponent(logFilter.status) + "&limit=200");
    const tb = $("#logBody");
    if (!tb) return;
    const items = r.items || [];
    tb.innerHTML = items.length ? items.map((e) => `<tr>
      <td class="hint nw">${hms(e.t)}</td>
      <td class="hint opt">${esc(e.ch || "chat")}</td>
      <td class="mono">${esc(e.model || "—")}</td>
      <td>${e.status >= 400 ? `<span class="tag bad">${e.status}</span>` : e.note ? `<span class="tag warn">${e.status}</span>` : `<span class="tag ok">${e.status}</span>`}</td>
      <td class="num opt">${e.ttfb_ms || 0} ms</td>
      <td class="num">${nf(e.dur_ms)} ms</td>
      <td class="num opt">${nf(e.total_tokens)}</td>
      <td class="hint" style="color:${e.err ? "var(--bad)" : e.note ? "var(--warn)" : "var(--ink-3)"};max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.err || e.note || e.account || "")}">${esc(e.err || e.note || e.account || "—")}</td>
    </tr>`).join("") : `<tr><td colspan="8"><div class="empty">暂无日志</div></td></tr>`;
  } catch (e) { toast(e.message, "bad"); }
}

/* ══ 添加账号：浏览器授权 / 粘贴 Cookie ═══════════════════════════ */
function openAddAccount(mode) {
  const isCookie = mode === "cookie";
  const form = isCookie ? `
    <label class="fld"><span class="lb">Meoo Cookie</span>
      <textarea id="ckInput" rows="4" style="font-size:11.5px" placeholder="开发者工具 Network → 任意 meoo.com 请求 → Request Headers → Cookie 整段复制"></textarea>
    </label>
    <label class="fld"><span class="lb">备注（可选）</span><input id="ckLabel" type="text" placeholder="例如：主账号"></label>
    <p class="hint">服务端用这段 Cookie 直接完成 CLI 授权，不需要打开浏览器。Cookie 以 0600 存在数据目录，不回显；<b>login_oneday_ticket 只有一天寿命</b>，只适合一次性接入。</p>
  ` : `
    <div id="devBox">
      <span class="lb" style="display:block;font-size:12.5px;color:var(--ink-2);margin-bottom:5px">授权链接</span>
      <div class="url" id="devUrl">正在创建授权会话…</div>
      <div class="progress"><i id="devBar"></i></div>
      <div class="state" id="devStat" style="margin-top:10px"><span class="pulse warn"></span><span>等待授权…</span></div>
      <div style="display:flex;gap:8px;margin-top:12px">
        <button class="xs" onclick="copyDev()">复制链接</button>
        <a class="xs" id="devOpen" target="_blank" rel="noopener" style="text-decoration:none;display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:6px;padding:3.5px 9px;color:var(--ink)">在新标签打开</a>
      </div>
      <p class="hint" style="margin-top:10px">在打开的页面登录并确认授权，本窗口会自动完成建项目、开云服务与入池。</p>
    </div>`;

  modal(`
    <header>
      <h2>添加账号</h2>
      <div class="tabs">
        <button class="tab ${isCookie ? "" : "on"}" onclick="openAddAccount()">浏览器授权</button>
        <button class="tab ${isCookie ? "on" : ""}" onclick="openAddAccount('cookie')">粘贴 Cookie</button>
      </div>
    </header>
    <div class="body">${form}</div>
    <footer><span class="grow"></span>
      <button onclick="closeModal()">取消</button>
      ${isCookie ? `<button class="primary" onclick="submitCookie(this)">接入</button>` : ""}
    </footer>`, { keep: true });

  if (!isCookie) startDevice();
}

function openDevice() { openAddAccount(); }

/* 设备授权：后端三个接口早就有了，前端此前从未调用 —— 页签永远停在「创建授权会话中…」。 */
async function startDevice() {
  stopDevice();
  setDevStat("正在创建授权会话…", "wait");
  let sess;
  try {
    sess = await api("/admin/api/device/start", { method: "POST" });
  } catch (e) { setDevStat("创建失败：" + e.message, "bad"); return; }
  if (!sess || !sess.ok) { setDevStat("创建失败：" + ((sess && sess.error) || "未知错误"), "bad"); return; }

  const urlEl = $("#devUrl");
  if (urlEl) urlEl.textContent = sess.login_url;
  const openEl = $("#devOpen");
  if (openEl) openEl.href = sess.login_url;
  setDevStat("等待你在浏览器完成授权…", "wait");

  const deadline = Date.now() + (sess.expires_in || 900) * 1000;
  let busy = false;
  devTimer = setInterval(async () => {
    if (busy) return;
    if (Date.now() > deadline) { stopDevice(); setDevStat("授权会话已过期，请重新打开本窗口", "bad"); return; }
    busy = true;
    try {
      const r = await api("/admin/api/device/poll?sid=" + encodeURIComponent(sess.session_id));
      const status = (r && r.status) || "unknown";
      if (status === "approved") {
        stopDevice();
        setDevStat("已授权，正在建项目并开通云服务…", "wait");
        const bar = $("#devBar");
        if (bar) bar.style.display = "none";
        const done = await api("/admin/api/device/attach", { method: "POST", body: JSON.stringify({ session_id: sess.session_id }) });
        if (done && done.ok) {
          setDevStat("接入成功，凭证已入池", "ok");
          await load(true);
          setTimeout(() => { closeModal(); toast("账号已接入"); }, 700);
        } else setDevStat("接入失败：" + ((done && done.error) || "未知错误"), "bad");
        return;
      }
      if (status === "expired" || status === "unknown") {
        stopDevice();
        setDevStat(status === "expired" ? "授权会话已过期，请重新打开本窗口" : "授权会话不存在，请重新打开本窗口", "bad");
        return;
      }
      if (r && r.ok === false && r.error) setDevStat("轮询失败：" + r.error, "bad");
      else setDevStat("等待你在浏览器完成授权…（剩余 " + Math.max(0, Math.floor((deadline - Date.now()) / 1000)) + "s）", "wait");
    } catch (e) { setDevStat("轮询失败：" + e.message, "bad"); }
    finally { busy = false; }
  }, 2500);
}

function stopDevice() { if (devTimer) { clearInterval(devTimer); devTimer = null; } }

function setDevStat(msg, kind) {
  const el = $("#devStat");
  if (!el) return;
  el.className = "state" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
  el.innerHTML = '<span class="pulse ' + (kind === "ok" ? "" : kind === "bad" ? "bad" : "warn") + '"></span><span>' + esc(msg) + "</span>";
}

function copyDev() {
  const t = $("#devUrl") ? $("#devUrl").textContent : "";
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast("链接已复制"), () => toast("复制失败，请手动选中", "bad"));
}

async function submitCookie(btn) {
  const ck = $("#ckInput").value.trim();
  if (!ck) { toast("请粘贴 Cookie", "bad"); return; }
  const old = btn.textContent; btn.disabled = true; btn.textContent = "接入中";
  try {
    const r = await api("/admin/api/cookie/attach", { method: "POST", body: JSON.stringify({ cookie: ck, label: $("#ckLabel").value.trim() }) });
    if (r.ok) {
      closeModal(); await load(true);
      const res = r.result || {};
      modal(`<header><h2>${res.cookie_only ? "已更新登录态" : "接入成功"}</h2></header>
        <div class="body">
          <p class="hint">${res.cookie_only ? "该账号已有可用凭证，本次只补充了 Cookie。" : "项目已开通，项目 AK 已入池。"}</p>
          <div class="hint">身份 <b style="color:var(--ink)">${esc(res.name || "")}</b></div>
          <div class="hint mono">user_id ${esc(res.user_id || "")}</div>
          ${res.project_id ? `<div class="hint mono">project ${esc(res.project_id)}</div>` : ""}
        </div>
        <footer><span class="grow"></span><button class="primary" onclick="closeModal()">完成</button></footer>`);
    } else { toast("接入失败：" + r.error, "bad"); btn.disabled = false; btn.textContent = old; }
  } catch (e) { toast(e.message, "bad"); btn.disabled = false; btn.textContent = old; }
}

/* ══ 在线调试 ═════════════════════════════════════════════════════ */
function openDebug() {
  const opts = (S.models || []).map((m) => `<option value="${esc(m.id)}">${esc(m.id)}</option>`).join("");
  modal(`
    <header><h2>在线调试</h2><div class="hint">直接打一次上游非流式对话，验证凭证与模型</div></header>

      <label class="fld"><span class="lb">模型</span><select id="dbgModel">${opts || '<option value="qwen">qwen</option>'}</select></label>

      <pre class="out" id="dbgOut" style="display:none"></pre>
    </div>
    <footer><span class="grow"></span><button onclick="closeModal()">关闭</button>
      <button class="primary" onclick="runDebug(this)">发送</button></footer>`);
}

async function runDebug(btn) {
  const old = btn.textContent; btn.disabled = true; btn.textContent = "请求中";
  const out = $("#dbgOut");
  out.style.display = "block"; out.textContent = "等待上游…";
  try {
    const r = await api("/admin/api/test", { method: "POST", body: JSON.stringify({ model: $("#dbgModel").value, prompt: $("#dbgPrompt").value, max_tokens: 256 }) });
    if (!r.ok) out.textContent = "失败：" + (r.error || "") + (r.http ? "（HTTP " + r.http + "）" : "");
    else {
      const c = r.raw && r.raw.choices && r.raw.choices[0];
      const text = c && c.message ? c.message.content : JSON.stringify(r.raw, null, 2);
      out.textContent = (text || "（空正文）") + "\n\n— " + r.elapsed_ms + " ms · " + (r.account || "") + " · " + (r.model || "");
    }
  } catch (e) { out.textContent = "失败：" + e.message; }
  btn.disabled = false; btn.textContent = old;
}

/* ══ 弹层与计时 ═══════════════════════════════════════════════════ */
function modal(html, opts) {
  const keep = !!(opts && opts.keep);
  $("#modalHost").innerHTML = `<div class="veil on" onclick="if(event.target===this&&${!keep})closeModal()"><div class="dlg">${html}</div></div>`;
}
function closeModal() { stopDevice(); $("#modalHost").innerHTML = ""; }

/* 冷却倒计时：只改文本，不重渲染整页 */
function tick() {
  document.querySelectorAll("[data-until]").forEach((el) => {
    const until = Number(el.dataset.until || 0);
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { el.textContent = "0s"; return; }
    el.textContent = left >= 60 ? Math.floor(left / 60) + "m" + (left % 60) + "s" : left + "s";
  });
}

/* ══ 启动 ═════════════════════════════════════════════════════════ */
(async function boot() {
  applyTheme(document.documentElement.dataset.pref || "auto");
  try {
    const h = await fetch("/healthz").then((r) => r.json());
    if (h && h.version) VER = h.version;
    if (h && h.upstream) UP = String(h.upstream).replace(/^https?:\/\//, "").replace(/\/meoo-ai.*$/, "");
    $("#loginVer").textContent = "版本 " + VER;
  } catch (e) { /* 版本号拿不到不影响使用 */ }
  try {
    const r = await api("/admin/api/ping");
    if (r.authed) { showApp(); await load(); } else showLogin();
  } catch (e) { showLogin(); }
})();
</script>
