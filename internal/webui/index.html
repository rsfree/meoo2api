<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>meoo2api 控制台</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --panel2:#fbfbfd; --line:#e5e7eb; --line2:#eef0f3;
  --text:#111827; --muted:#6b7280; --dim:#9ca3af;
  --ok:#15803d; --okbg:#e9f7ee; --warn:#b45309; --warnbg:#fdf3e3; --err:#b91c1c; --errbg:#fdecec;
  --accent:#4f46e5; --accentbg:#eef0ff; --radius:14px;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0c0d10; --panel:#15171c; --panel2:#191c22; --line:#282c34; --line2:#22252c;
    --text:#e8eaee; --muted:#9aa1ad; --dim:#6b7280;
    --ok:#4ade80; --okbg:#12261a; --warn:#fbbf24; --warnbg:#2a2110; --err:#f87171; --errbg:#2a1414;
    --accent:#a5b4fc; --accentbg:#1c1f34;
  }
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:14px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;-webkit-font-smoothing:antialiased}
button{font:inherit;cursor:pointer}
input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.tag{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:12px;font-weight:500;line-height:18px}
.tag.ok{background:var(--okbg);color:var(--ok)}
.tag.warn{background:var(--warnbg);color:var(--warn)}
.tag.err{background:var(--errbg);color:var(--err)}
.tag.mut{background:var(--line2);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--ok)}.dot.warn{background:var(--warn)}.dot.err{background:var(--err)}.dot.mut{background:var(--dim)}

/* 登录 */
.login{min-height:100%;display:grid;place-items:center;padding:24px}
.login .card{width:340px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:26px;box-shadow:0 12px 40px rgba(16,24,40,.06)}
.login h1{font-size:18px;margin:0 0 4px}
.login p{margin:0 0 18px;color:var(--muted);font-size:13px}
.field{display:flex;flex-direction:column;gap:6px;margin-bottom:14px}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=password],input[type=number],select,textarea{
  width:100%;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:var(--panel2);outline:none;transition:border-color .15s,box-shadow .15s
}
input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accentbg)}
.btn{padding:9px 15px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--text);transition:transform .06s,background .15s}
.btn:hover{background:var(--panel2)}
.btn:active{transform:scale(.985)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.05)}
.btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
.btn.danger{color:var(--err);border-color:var(--errbg)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
.btn.ghost:hover{background:var(--panel2);color:var(--text)}

/* 主框架 */
#app{display:flex;flex-direction:column;height:100%}
#app[hidden]{display:none!important}
header.top{display:flex;align-items:center;gap:16px;padding:14px 22px;background:var(--panel);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-weight:650;letter-spacing:-.2px}
.brand .logo{width:22px;height:22px;border-radius:7px;background:linear-gradient(135deg,#6366f1,#8b5cf6);display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700}
.top .grow{flex:1}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;background:var(--panel2);border:1px solid var(--line);font-size:12px;color:var(--muted)}
nav.tabs{display:flex;gap:4px;padding:10px 18px 0;background:var(--panel);border-bottom:1px solid var(--line)}
nav.tabs button{border:none;background:transparent;color:var(--muted);padding:9px 14px;border-radius:10px 10px 0 0;font-weight:550;position:relative}
nav.tabs button.active{color:var(--text)}
nav.tabs button.active::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;background:var(--accent);border-radius:2px}
main{flex:1;overflow:auto;padding:22px}
.wrap{max-width:1440px;margin:0 auto}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g5{grid-template-columns:repeat(5,minmax(0,1fr))}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
@media(max-width:1000px){.g4{grid-template-columns:repeat(2,1fr)}.g5{grid-template-columns:repeat(2,1fr)}.g2{grid-template-columns:1fr}}
@media(max-width:620px){.g4,.g5{grid-template-columns:1fr}main{padding:14px}}

.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:16px}
.card h3{margin:0 0 2px;font-size:13px;color:var(--muted);font-weight:550;letter-spacing:.01em}
.kpi{font-size:26px;font-weight:650;letter-spacing:-.6px;margin-top:6px}
.kpi small{font-size:13px;font-weight:500;color:var(--muted);letter-spacing:0}
.sub{font-size:12px;color:var(--dim);margin-top:4px}

.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.toolbar .grow{flex:1}

/* 账号卡 */
.acc{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:15px;display:flex;flex-direction:column;gap:12px}
.acc .head{display:flex;align-items:center;gap:10px}
.avatar{width:34px;height:34px;border-radius:10px;background:var(--accentbg);color:var(--accent);display:grid;place-items:center;font-weight:650;font-size:14px;flex:none}
.acc .name{font-weight:600;font-size:14px;line-height:1.3;word-break:break-all}
.acc .meta{font-size:12px;color:var(--muted)}
.acc .body{display:flex;flex-direction:column;gap:8px}
.kv{display:flex;justify-content:space-between;font-size:12.5px;color:var(--muted)}
.kv b{color:var(--text);font-weight:600}
.keyrow{display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line2);border-radius:10px;background:var(--panel2);font-size:12px}
.keyrow .kk{font-family:var(--mono);color:var(--muted);flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acc .actions{display:flex;gap:6px;flex-wrap:wrap}

/* 表格 */
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{text-align:left;color:var(--muted);font-weight:550;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
td{padding:8px 10px;border-bottom:1px solid var(--line2);vertical-align:middle}
tbody tr:hover{background:var(--panel2)}
td.mono{font-family:var(--mono);font-size:12px}
.empty{padding:34px;text-align:center;color:var(--dim);font-size:13px}

/* 弹窗 */
.mask{position:fixed;inset:0;background:rgba(10,12,16,.42);display:grid;place-items:center;padding:20px;z-index:50;backdrop-filter:blur(2px)}
.modal{width:min(520px,100%);background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 24px 60px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h2{margin:0 0 4px;font-size:16px}
.modal .hint{color:var(--muted);font-size:12.5px;margin:0 0 16px}
.modal .foot{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.bar{height:4px;background:var(--line2);border-radius:99px;overflow:hidden;margin-top:10px}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.code{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px;word-break:break-all;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#111827;color:#fff;padding:9px 16px;border-radius:999px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:99}
.toast.on{opacity:1;transform:translateX(-50%) translateY(-4px)}
.sect{margin:0 0 10px;font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.split{display:grid;grid-template-columns:1fr 1fr;gap:14px}
@media(max-width:820px){.split{grid-template-columns:1fr}}
.seg{display:inline-flex;gap:2px;padding:3px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;margin-bottom:16px}
.seg button{border:none;background:transparent;color:var(--muted);padding:6px 14px;border-radius:8px;font-size:13px;font-weight:550}
.seg button.active{background:var(--panel);color:var(--text);box-shadow:0 1px 2px rgba(16,24,40,.06)}
pre.out{margin:0;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:12px;white-space:pre-wrap;word-break:break-word;max-height:300px;overflow:auto}
</style>
</head>
<body>

<!-- 登录 -->
<div id="login" class="login">
  <div class="card">
    <h1>meoo2api 控制台</h1>
    <p>输入管理密码进入。首次启动的密码已打印在服务端日志里。</p>
    <div class="field"><label>管理密码</label><input id="pw" type="password" autocomplete="current-password" placeholder="••••••••"></div>
    <button class="btn primary" style="width:100%" onclick="doLogin()">进入</button>
    <div id="loginErr" style="color:var(--err);font-size:12.5px;margin-top:10px;min-height:18px"></div>
  </div>
</div>

<!-- 主界面 -->
<div id="app" hidden>
  <header class="top">
    <div class="brand"><span class="logo">M</span>meoo2api</div>
    <span class="pill" id="pillUp"><span class="dot mut"></span>连接中</span>
    <span class="pill num" id="pillKeys">可用 —</span>
    <div class="grow"></div>
    <span class="pill num" id="pillRate">成功率 —</span>
    <button class="btn sm ghost" onclick="load()">刷新</button>
    <button class="btn sm ghost" onclick="doLogout()">退出</button>
  </header>
  <nav class="tabs" id="tabs">
    <button data-v="overview" class="active">概览</button>
    <button data-v="accounts">账号</button>
    <button data-v="keys">凭证</button>
    <button data-v="logs">日志</button>
    <button data-v="settings">设置</button>
  </nav>
  <main><div class="wrap" id="view"></div></main>
</div>

<div id="modalHost"></div>
<div class="toast" id="toast"></div>

<script>
"use strict";
let S = null;            // 最近一次 /admin/api/state
let view = "overview";
let timer = null;
let logFilter = { ch: "", status: "" };
let devTimer = null;

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n) => Number(n || 0).toLocaleString("zh-CN");
const ts = (ms) => { if (!ms) return "—"; const d = new Date(ms); return d.toLocaleString("zh-CN", { hour12: false }); };
const ago = (ms) => { if (!ms || Number(ms) <= 0) return "从未"; const s = Math.floor((Date.now() - ms) / 1000); if (s < 60) return s + " 秒前"; if (s < 3600) return Math.floor(s / 60) + " 分钟前"; if (s < 86400) return Math.floor(s / 3600) + " 小时前"; return Math.floor(s / 86400) + " 天前"; };

function toast(msg, isErr) {
  const t = $("#toast");
  t.textContent = msg;
  t.style.background = isErr ? "#b91c1c" : "#111827";
  t.classList.add("on");
  clearTimeout(t._h);
  t._h = setTimeout(() => t.classList.remove("on"), 2400);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (res.status === 401) { showLogin(); throw new Error("未登录"); }
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { throw new Error("响应非 JSON: " + txt.slice(0, 120)); }
  return data;
}

/* ---------- 登录 ---------- */
function showLogin() { $("#login").style.display = "grid"; $("#app").hidden = true; if (timer) { clearInterval(timer); timer = null; } }
function showApp() { $("#login").style.display = "none"; $("#app").hidden = false; }

async function doLogin() {
  $("#loginErr").textContent = "";
  try {
    const r = await api("/admin/api/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    if (r.ok) { showApp(); await load(); } else { $("#loginErr").textContent = r.error || "登录失败"; }
  } catch (e) { $("#loginErr").textContent = e.message; }
}
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogout() {
  try { await api("/admin/api/logout", { method: "POST" }); } catch (e) {}
  showLogin();
}

/* ---------- 状态加载 ---------- */
async function load() {
  try {
    const r = await api("/admin/api/state");
    if (!r || !r.ok) throw new Error((r && r.error) || "读取状态失败");
    S = r;
    showApp();
    renderPills();
    render();
    if (!timer) timer = setInterval(tick, 10000);
  } catch (e) {
    if (String(e.message).indexOf("未登录") >= 0) return;
    toast(e.message, true);
  }
}

function renderPills() {
  const usable = S.usable || 0;
  const p = $("#pillUp");
  p.innerHTML = '<span class="dot ' + (usable > 0 ? "ok" : "err") + '"></span>' + (usable > 0 ? "上游可用" : "无可用凭证");
  $("#pillKeys").textContent = "可用 " + usable + " / " + ((S.accounts || []).length) + " 账号";
  const st = S.stats || {};
  $("#pillRate").textContent = "成功率 " + (st.success_rate || 0).toFixed(1) + "%";
}

/* ---------- 视图切换 ---------- */
$("#tabs").addEventListener("click", (e) => {
  const b = e.target.closest("button[data-v]");
  if (!b) return;
  view = b.dataset.v;
  document.querySelectorAll("#tabs button").forEach((x) => x.classList.toggle("active", x === b));
  render();
  if (view === "logs") loadLogs();
});

function render() {
  if (!S) return;
  const el = $("#view");
  if (view === "overview") el.innerHTML = viewOverview();
  else if (view === "accounts") el.innerHTML = viewAccounts();
  else if (view === "keys") el.innerHTML = viewKeys();
  else if (view === "logs") el.innerHTML = viewLogs();
  else if (view === "settings") el.innerHTML = viewSettings();
  tick();
}

/* ---------- 概览 ---------- */
function viewOverview() {
  const st = S.stats || {};
  const accs = S.accounts || [];
  const keys = [];
  accs.forEach((a) => (a.keys || []).forEach((k) => keys.push(k)));
  (S.orphan_keys || []).forEach((k) => keys.push(k));
  const healthy = keys.filter((k) => k.enabled && k.state === "ok").length;
  const cooling = keys.filter((k) => k.state !== "ok" && k.state !== "invalid" && k.cooldown_sec > 0).length;
  const bad = keys.filter((k) => k.state === "invalid").length;
  const points = accs.reduce((s, a) => s + (a.points || 0), 0);
  const cat = (S.catalog && S.catalog.status) || {};
  let costTotal = { spent: 0, tokens: 0, rate: 0 };
  accs.forEach((a) => { if (a.cost) { costTotal.spent += a.cost.spent || 0; costTotal.tokens += a.cost.tokens || 0; } });
  if (costTotal.spent > 0) costTotal.rate = Math.round(costTotal.tokens / costTotal.spent);

  return `
  <div class="grid g5">
    <div class="card"><h3>可用凭证</h3><div class="kpi num">${healthy}<small> / ${keys.length}</small></div>
      <div class="sub">冷却 ${cooling} · 失效 ${bad}</div></div>
    <div class="card"><h3>账号积分合计</h3><div class="kpi num">${nf(points)}</div>
      <div class="sub">${accs.length} 个账号</div></div>
    <div class="card"><h3>对话成功率</h3><div class="kpi num">${(st.success_rate || 0).toFixed(1)}<small>%</small></div>
      <div class="sub">成功 ${st.chat_ok || 0} · 失败 ${st.chat_err || 0}</div></div>
    <div class="card"><h3>平均首字节 / 耗时</h3><div class="kpi num">${st.avg_ttfb_ms || 0}<small> ms</small></div>
      <div class="sub">平均总耗时 ${nf(st.avg_dur_ms || 0)} ms</div></div>
    <div class="card"><h3>积分成本</h3><div class="kpi num">${costTotal.spent}<small> 分</small></div>
      <div class="sub">${nf(costTotal.tokens)} tokens${costTotal.rate ? " · ≈" + nf(costTotal.rate) + " tok/分" : ""}</div></div>
  </div>

  <div class="split" style="margin-top:14px">
    <div class="card">
      <h3>上游与模型目录</h3>
      <div class="body" style="margin-top:10px">
        <div class="kv"><span>上游地址</span><b class="mono" style="font-size:11.5px">${esc("api.meoo.host/meoo-ai/compatible-mode/v1")}</b></div>
        <div class="kv" style="margin-top:8px"><span>目录来源</span><b>${cat.source === "stale" ? "过期缓存" : "实时同步"} · ${cat.count || 0} 个模型</b></div>
        <div class="kv" style="margin-top:8px"><span>默认模型</span><b class="mono" style="font-size:11.5px">${esc(cat.default_model || "—")}</b></div>
        <div class="kv" style="margin-top:8px"><span>上次同步</span><b>${ago(cat.fetched_at)}</b></div>
        ${cat.error ? `<div class="sub" style="color:var(--err);margin-top:8px">${esc(cat.error)}</div>` : ""}
        <div style="margin-top:12px;display:flex;gap:8px">
          <button class="btn sm" onclick="refreshCatalog(this)">立即同步</button>
          <button class="btn sm ghost" onclick="sampleCost(this)">采样积分</button>
          <button class="btn sm ghost" onclick="openDebug()">在线调试</button>
        </div>
      </div>
    </div>
    <div class="card">
      <h3>运行状况</h3>
      <div class="body" style="margin-top:10px">
        <div class="kv"><span>进程运行</span><b>${Math.floor((S.uptime_sec || 0) / 3600)} 小时 ${Math.floor(((S.uptime_sec || 0) % 3600) / 60)} 分</b></div>
        <div class="kv" style="margin-top:8px"><span>客户端密钥</span><b>${(S.client_keys || []).length} 个</b></div>
        <div class="kv" style="margin-top:8px"><span>状态落盘</span><b style="color:${S.save_error ? "var(--err)" : "var(--ok)"}">${S.save_error ? "失败" : "正常"}</b></div>
        ${S.save_error ? `<div class="sub" style="color:var(--err)">${esc(S.save_error)}</div>` : ""}
        <div class="code" style="margin-top:12px">curl http://127.0.0.1:8791/v1/chat/completions \\<br>&nbsp;&nbsp;-H "Authorization: Bearer sk-…" -H "Content-Type: application/json" \\<br>&nbsp;&nbsp;-d '{"model":"qwen","messages":[{"role":"user","content":"你好"}]}'</div>
      </div>
    </div>
  </div>`;
}

async function sampleCost(btn) {
  btn.disabled = true; btn.textContent = "采样中…";
  try { await api("/admin/api/cost/sample", { method: "POST" }); await load(); toast("已采样积分"); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = "采样积分";
}

async function refreshCatalog(btn) {
  btn.disabled = true; btn.textContent = "同步中…";
  try { await api("/admin/api/catalog/refresh", { method: "POST" }); await load(); toast("模型目录已刷新"); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = "立即同步";
}

/* ---------- 账号 ---------- */
function viewAccounts() {
  const accs = S.accounts || [];
  return `
  <div class="toolbar">
    <button class="btn primary" onclick="openAddAccount()">+ 添加账号</button>
    <button class="btn" onclick="openAddKey()">手动添加项目 AK</button>
    <div class="grow"></div>
    <span class="sub">${accs.length} 个账号 · ${S.usable || 0} 条可用凭证</span>
  </div>
  ${accs.length === 0 ? `<div class="card"><div class="empty">还没有账号。点「添加账号」，在弹出的授权页登录一次 Meoo 即可自动建项目、开通云服务并把项目 AK 入池。</div></div>` :
    `<div class="grid g2">${accs.map(accCard).join("")}</div>`}`;
}

function accCard(a) {
  const keys = a.keys || [];
  const st = keyState(keys);
  return `
  <div class="acc">
    <div class="head">
      <div class="avatar">${esc((a.label || a.name || "M").slice(0, 1).toUpperCase())}</div>
      <div style="flex:1;min-width:0">
        <div class="name">${esc(a.label || a.name || a.user_id || "未命名账号")}</div>
        <div class="meta mono" style="font-size:11px">${esc(a.user_id || "—")} ${a.project_id ? "· " + esc(a.project_id) : ""}</div>
      </div>
      <span class="tag ${st.cls}">${st.text}</span>
    </div>
    <div class="body">

        </div>`).join("") : `<div class="sub">尚无项目 AK，点「重新开通」补齐</div>`}

    </div>

function keyState(keys) {
  if (!keys.length) return { cls: "mut", text: "无凭证" };
  const ok = keys.filter((k) => k.enabled && k.state === "ok").length;
  if (ok > 0) return { cls: "ok", text: ok + " 可用" };
  if (keys.some((k) => k.state === "invalid")) return { cls: "err", text: "凭证失效" };
  return { cls: "warn", text: "冷却中" };
}

async function keyAct(id, action, btn) {
  if (action === "delete" && !confirm("从号池删除该凭证？")) return;
  const old = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "…"; }
  try {
    const r = await api("/admin/api/keys/action", { method: "POST", body: JSON.stringify({ id, action }) });
    if (action === "probe" || action === "repair") toast(r.message || (r.ok ? "成功" : "失败"), !r.ok);
    else toast("已" + ({ release: "解除冷却", delete: "删除", toggle: "切换" }[action] || action));
    await load();
  } catch (e) { toast(e.message, true); }
  if (btn) { btn.disabled = false; btn.textContent = old; }
}

async function saveConfig(btn, withPassword) {
  btn.disabled = true;
  try {
    const aliases = {};
    const txt = $("#cAliases") ? $("#cAliases").value : "";
    txt.split("\n").forEach((line) => {
      const i = line.indexOf("=");
      if (i > 0) aliases[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    });
    const body = {
      default_max_tokens: Number($("#cMax").value || 0),
      request_timeout_sec: Number($("#cTimeout").value || 180),
      quota_cooldown_sec: Number($("#cQuota").value || 0),
      rate_cooldown_sec: Number($("#cRate").value || 0),
      keepalive_sec: Number($("#cKeep").value || 0),
      failover: $("#cFailover").checked,
      aliases,
    };
    if (withPassword) {
      const pw = $("#cPw").value;
      if (!pw) { toast("请输入新密码", true); btn.disabled = false; return; }
      body.new_password = pw;
    }
    const r = await api("/admin/api/config", { method: "POST", body: JSON.stringify(body) });
    if (r.ok) { toast("已保存"); await load(); if (withPassword) $("#cPw").value = ""; }
    else toast(r.error, true);
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

async function runDebug(btn) {
  btn.disabled = true; btn.textContent = "请求中…";
  const out = $("#dbgOut");
  out.style.display = "block"; out.textContent = "等待上游…";
  try {
    const r = await api("/admin/api/test", { method: "POST", body: JSON.stringify({ model: $("#dbgModel").value, prompt: $("#dbgPrompt").value, max_tokens: 256 }) });
    if (!r.ok) { out.textContent = "失败：" + (r.error || "") + (r.http ? "（HTTP " + r.http + "）" : ""); }
    else {
      const c = r.raw && r.raw.choices && r.raw.choices[0];
      const text = c && c.message ? c.message.content : JSON.stringify(r.raw, null, 2);
      out.textContent = text + "\n\n— " + r.elapsed_ms + " ms · " + (r.account || "") + " · " + (r.model || "");
    }
  } catch (e) { out.textContent = "失败：" + e.message; }
  btn.disabled = false; btn.textContent = "发送";
}

/* ---------- 弹窗 ---------- */
function modal(html, title, opts) {
  const host = $("#modalHost");
  host.innerHTML = `<div class="mask" onclick="if(event.target===this&&!${!!(opts && opts.keep)})closeModal()"><div class="modal">${html}</div></div>`;
  if (title) document.title = title + " · meoo2api";
}
function closeModal() {
  if (devTimer) { clearInterval(devTimer); devTimer = null; }
  $("#modalHost").innerHTML = "";
  document.title = "meoo2api 控制台";
}

/* ---------- 倒计时 ---------- */
function tick() {
  document.querySelectorAll("[data-until]").forEach((el) => {
    const until = Number(el.dataset.until || 0);
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { el.textContent = "0s"; return; }
    el.textContent = left >= 60 ? Math.floor(left / 60) + "m" + (left % 60) + "s" : left + "s";
  });
}

/* ---------- 启动 ---------- */
(async function boot() {
  try {
    const r = await api("/admin/api/ping");
    if (r.authed) { showApp(); await load(); } else showLogin();
  } catch (e) { showLogin(); }
})();
</script>
</body>
