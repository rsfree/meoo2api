<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>meoo2api 控制台</title>
<!-- 站点图标：与 .brand .mark 同一图形（靛蓝圆角块 + 白色折线），data URI 内联避免额外路由。 -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%235b7cfa'/%3E%3Cpath d='M9 20.5v-9l7 5.5 7-5.5v9' fill='none' stroke='%23fff' stroke-width='2.6' stroke-linejoin='round' stroke-linecap='round'/%3E%3C/svg%3E">
<script>
/* 主题在首帧前定好，避免浅色页面闪一下再变深。三态：auto / light / dark。
   auto 跟随系统，light/dark 由用户显式选择（存在 localStorage）。 */
(function () {
  var t = "auto";
  try { t = localStorage.getItem("meoo.theme") || "auto"; } catch (e) {}
  var dark = t === "dark" || (t === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = t;
})();
</script>
<style>
/* ── 设计令牌：明暗两套独立色板 ─────────────────────────────────────────
   冷石墨基调（仪表盘语言，不是营销页）：底色分层 + 单一靛蓝强调（只给交互），
   语义色只给状态。所有观测值走等宽体 + tabular-nums，纵向扫视才对得齐。
   对比度：--ink-3 承载表头/时间戳/说明，11.5px 小字必须过 AA 4.5:1；
   实心按钮单独用 --accent-solid（--accent 叠白字只有 3.68:1，不达标）。 */
:root {
  --bg: #f4f5f8; --surface: #ffffff; --surface-2: #f8f9fb; --raise: #ffffff;
  --line: #e2e5ec; --line-soft: #eceef3;
  --ink: #14171f; --ink-2: #545c6e; --ink-3: #666e7f;
  --accent: #3d5fe0; --accent-solid: #3d5fe0; --accent-ink: #fff; --accent-soft: rgba(61,95,224,.09);
  --ok: #0a7a4c; --ok-soft: rgba(10,122,76,.1);
  --warn: #b47611; --warn-soft: rgba(180,118,17,.11);
  --bad: #cf3b34; --bad-soft: rgba(207,59,52,.09);
  --shadow: 0 1px 2px rgba(16,20,32,.06), 0 8px 24px -14px rgba(16,20,32,.14);
  --mono: ui-monospace, "Cascadia Mono", "SF Mono", Menlo, Consolas, monospace;
  --sans: system-ui, -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
}
html[data-theme="dark"] {
  --bg: #0c0e14; --surface: #14171f; --surface-2: #1a1e28; --raise: #202531;
  --line: #262c3a; --line-soft: #1e232e;
  --ink: #e8ebf2; --ink-2: #a8b0c2; --ink-3: #7c8599;
  --accent: #5b7cfa; --accent-solid: #4a6ae8; --accent-ink: #fff; --accent-soft: rgba(91,124,250,.13);
  --ok: #3ddc97; --ok-soft: rgba(61,220,151,.12);
  --warn: #f5b544; --warn-soft: rgba(245,181,68,.12);
  --bad: #f0655f; --bad-soft: rgba(240,101,95,.12);
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
}
html[data-theme="dark"] { color-scheme: dark; }
html[data-theme="light"] { color-scheme: light; }

* { box-sizing: border-box; margin: 0; padding: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 14px/1.55 var(--sans);
  -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%;
}
::selection { background: var(--accent-soft); }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
.mono { font-family: var(--mono); }
.num { font-variant-numeric: tabular-nums; }
.hint { color: var(--ink-3); font-size: 12.5px; }
.grow { flex: 1; }
.nw { white-space: nowrap; }
.kv { display: flex; align-items: baseline; gap: 8px; font-size: 12.5px; flex-wrap: wrap; }
.kv > b { font-weight: 600; }

/* ── 壳层：左导航 + 主区 ─────────────────────────────────────────── */
.shell { display: grid; grid-template-columns: 208px 1fr; min-height: 100vh; }
.nav {
  background: var(--surface); border-right: 1px solid var(--line);
  display: flex; flex-direction: column; position: sticky; top: 0; height: 100vh;
}
.brand { padding: 18px 16px 15px; border-bottom: 1px solid var(--line-soft); display: flex; align-items: center; gap: 10px; }
.brand .mark { width: 26px; height: 26px; flex: none; display: block; }
.brand .name { font-weight: 650; letter-spacing: -.01em; font-size: 15px; }
.brand .sub { color: var(--ink-3); font-size: 11px; font-family: var(--mono); margin-top: 2px; }
.nav ul { list-style: none; padding: 10px 8px; flex: 1; }
.nav a {
  display: flex; align-items: center; gap: 10px; padding: 8px 11px; margin-bottom: 2px;
  color: var(--ink-2); text-decoration: none; border-radius: 7px; font-size: 13.5px; cursor: pointer;
  transition: background .12s, color .12s;
}
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a.on { background: var(--accent-soft); color: var(--accent); font-weight: 550; }
.nav a svg { width: 15px; height: 15px; flex: none; opacity: .85; }
.nav a .badge {
  margin-left: auto; font: 600 10.5px var(--mono); padding: 1px 6px; border-radius: 999px;
  background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line-soft);
}
.nav a .badge.bad { background: var(--bad-soft); color: var(--bad); border-color: transparent; }
.nav .sig { padding: 11px 15px; border-top: 1px solid var(--line-soft); font-size: 11px; color: var(--ink-3); }
.nav .sig .row { display: flex; align-items: center; gap: 6px; }
.nav .sig .row + .row { margin-top: 5px; }

main { min-width: 0; display: flex; flex-direction: column; }
.topbar {
  display: flex; align-items: center; gap: 10px; padding: 13px 20px;
  background: color-mix(in srgb, var(--surface) 88%, transparent);
  border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 20;
  backdrop-filter: blur(8px);
}
.topbar h1 { font-size: 15px; font-weight: 620; letter-spacing: -.01em; }
.topbar .desc { color: var(--ink-3); font-size: 12px; margin-left: 2px; }
.wrap { padding: 16px 20px 44px; display: flex; flex-direction: column; gap: 14px; }

/* ── 通用控件 ─────────────────────────────────────────────────────── */
.pill {
  display: inline-flex; align-items: center; gap: 6px; padding: 4px 10px; border-radius: 999px;
  background: var(--surface-2); border: 1px solid var(--line-soft); font-size: 11.5px; color: var(--ink-2);
  white-space: nowrap;
}
.pill .v { font-family: var(--mono); font-variant-numeric: tabular-nums; color: var(--ink); }
.dot { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-3); flex: none; }
.dot.ok { background: var(--ok); } .dot.warn { background: var(--warn); } .dot.bad { background: var(--bad); }
.dot.pulse { box-shadow: 0 0 0 0 currentColor; animation: pulse 2s infinite; color: var(--ok); background: var(--ok); }
@keyframes pulse { 70% { box-shadow: 0 0 0 5px rgba(0,0,0,0); } 100% { box-shadow: 0 0 0 0 rgba(0,0,0,0); } }

.tag {
  display: inline-flex; align-items: center; gap: 4px; padding: 1px 7px; border-radius: 5px;
  font-size: 11.5px; font-weight: 550; line-height: 17px; white-space: nowrap;
}
.tag.ok { background: var(--ok-soft); color: var(--ok); }
.tag.warn { background: var(--warn-soft); color: var(--warn); }
.tag.bad { background: var(--bad-soft); color: var(--bad); }
.tag.mute { background: var(--surface-2); color: var(--ink-3); border: 1px solid var(--line-soft); }
.tag.acc { background: var(--accent-soft); color: var(--accent); }

button { font: inherit; cursor: pointer; }
.btn {
  display: inline-flex; align-items: center; gap: 6px; padding: 7px 13px; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 13px;
  transition: background .12s, border-color .12s, transform .06s; white-space: nowrap;
}
.btn:hover { background: var(--surface-2); border-color: var(--line); }
.btn:active { transform: scale(.985); }
.btn:disabled { opacity: .55; cursor: not-allowed; }
.btn.primary { background: var(--accent-solid); border-color: var(--accent-solid); color: var(--accent-ink); font-weight: 550; }
.btn.primary:hover { filter: brightness(1.06); }
.btn.xs { padding: 3px 9px; font-size: 12px; border-radius: 6px; }
.btn.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
.btn.ghost:hover { background: var(--surface-2); color: var(--ink); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); border-color: transparent; }
.iconbtn {
  width: 30px; height: 30px; display: inline-grid; place-items: center; border-radius: 8px;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink-2);
}
.iconbtn:hover { background: var(--surface-2); color: var(--ink); }

input[type=text], input[type=password], input[type=number], select, textarea {
  width: 100%; padding: 8px 11px; border: 1px solid var(--line); border-radius: 8px;
  background: var(--surface); color: var(--ink); outline: none; font-size: 13px;
  transition: border-color .12s, box-shadow .12s;
}
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { resize: vertical; line-height: 1.5; }
.field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 13px; }
.field > label { font-size: 12px; color: var(--ink-2); font-weight: 550; }
.field .hint { font-weight: 400; }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.search {
  position: relative; display: flex; align-items: center;
}
.search input { padding-left: 30px; width: 220px; }
.search svg { position: absolute; left: 9px; width: 14px; height: 14px; color: var(--ink-3); pointer-events: none; }

/* ── 卡片 / 面板 ─────────────────────────────────────────────────── */
.box { background: var(--surface); border: 1px solid var(--line-soft); border-radius: 11px; overflow: hidden; }
.box > header {
  display: flex; align-items: center; gap: 9px; padding: 11px 15px;
  border-bottom: 1px solid var(--line-soft); background: var(--surface);
}
.box > header h3 { font-size: 13px; font-weight: 620; }
.box > header .note { color: var(--ink-3); font-size: 11.5px; }
.box .pad { padding: 14px 15px; }
.box .pad.tight { padding: 10px 15px; }
.two { display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; align-items: start; }
@media (max-width: 1080px) { .two { grid-template-columns: 1fr; } }

/* KPI：左侧 3px 色轨是唯一重色，数字大、标签小，扫一眼读量级 */
.kpis { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 10px; }
@media (max-width: 1280px) { .kpis { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 700px) { .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.kpi {
  position: relative; min-width: 0; overflow: hidden;
  background: var(--surface); border: 1px solid var(--line-soft);
  border-radius: 10px; padding: 11px 13px 12px 15px;
}
.kpi::before { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--kpi-c, var(--line)); }
.kpi .k { font-size: 11.5px; color: var(--ink-3); white-space: nowrap; }
.kpi .v {
  font: 600 22px/1.2 var(--mono); font-variant-numeric: tabular-nums; margin-top: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.kpi .v small { font-size: 12px; font-weight: 500; color: var(--ink-3); margin-left: 2px; }
.kpi .s { font-size: 11px; color: var(--ink-3); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi.c-acc { --kpi-c: var(--accent); } .kpi.c-acc .v { color: var(--accent); }
.kpi.c-ok { --kpi-c: var(--ok); } .kpi.c-ok .v { color: var(--ok); }
.kpi.c-warn { --kpi-c: var(--warn); } .kpi.c-warn .v { color: var(--warn); }
.kpi.c-bad { --kpi-c: var(--bad); } .kpi.c-bad .v { color: var(--bad); }

/* ── 表格 ────────────────────────────────────────────────────────── */
.scroll-x { overflow-x: auto; }
table.tbl { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.tbl th {
  text-align: left; font-size: 11px; font-weight: 600; letter-spacing: .02em; color: var(--ink-3);
  padding: 8px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); white-space: nowrap;
}
table.tbl td { padding: 9px 12px; border-bottom: 1px solid var(--line-soft); vertical-align: middle; }
table.tbl tbody tr:last-child td { border-bottom: none; }
table.tbl tbody tr:hover { background: color-mix(in srgb, var(--surface-2) 65%, transparent); }
table.tbl .who { font-weight: 600; }
table.tbl .sub { color: var(--ink-3); font-size: 11px; margin-top: 2px; }
table.tbl .ops { text-align: right; white-space: nowrap; }
.empty { padding: 34px 16px; text-align: center; color: var(--ink-3); font-size: 12.5px; }
.empty .t { color: var(--ink-2); font-weight: 600; font-size: 13px; margin-bottom: 4px; }

.keys { display: flex; flex-direction: column; gap: 4px; }
.kchip {
  display: inline-flex; align-items: center; gap: 6px; font: 11px var(--mono); color: var(--ink-2);
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 5px;
  padding: 2px 6px; width: fit-content; max-width: 100%;
}
.kchip .cd { color: var(--warn); font-variant-numeric: tabular-nums; }
.kchip button { border: 0; background: transparent; color: var(--ink-3); font: 11px var(--sans); padding: 0 2px; }
.kchip button:hover { color: var(--accent); }

/* ── 弹层 ────────────────────────────────────────────────────────── */
.veil {
  position: fixed; inset: 0; background: rgba(6,8,13,.5); backdrop-filter: blur(2px);
  display: none; z-index: 60; padding: 20px; overflow: auto;
}
.veil.on { display: flex; align-items: flex-start; justify-content: center; }
.dlg {
  background: var(--surface); border: 1px solid var(--line); border-radius: 13px;
  width: 560px; max-width: 100%; margin: auto; box-shadow: 0 24px 64px -24px rgba(0,0,0,.55);
  display: flex; flex-direction: column;
}
.dlg header { padding: 16px 19px 12px; border-bottom: 1px solid var(--line-soft); }
.dlg header h2 { font-size: 15px; font-weight: 620; }
.dlg .body { padding: 16px 19px; }
.dlg footer { padding: 12px 19px; border-top: 1px solid var(--line-soft); display: flex; gap: 9px; }
.dlg footer .grow { flex: 1; }
.seg { display: inline-flex; gap: 2px; background: var(--surface-2); border-radius: 9px; padding: 3px; margin-bottom: 14px; }
.seg button {
  padding: 5px 14px; border: none; background: transparent; color: var(--ink-3);
  font-size: 12.5px; font-weight: 550; border-radius: 7px;
}
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.url {
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: 10px 12px; font: 11.5px var(--mono); word-break: break-all; color: var(--accent);
  user-select: all; margin: 8px 0 12px;
}
.bar { height: 4px; border-radius: 3px; background: var(--surface-2); overflow: hidden; }
.bar i { display: block; height: 100%; width: 30%; background: var(--accent); border-radius: 3px; animation: slide 1.4s ease-in-out infinite; }
@keyframes slide { 0% { margin-left: -30%; } 100% { margin-left: 100%; } }
.state { font-size: 12.5px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
.state.ok { color: var(--ok); } .state.bad { color: var(--bad); }
pre.out {
  background: var(--surface-2); border: 1px solid var(--line-soft); border-radius: 8px;
  padding: 11px 12px; font: 12px/1.6 var(--mono); white-space: pre-wrap; word-break: break-word;
  max-height: 320px; overflow: auto;
}
code.inline {
  font: 11.5px var(--mono); background: var(--surface-2); border: 1px solid var(--line-soft);
  border-radius: 5px; padding: 1px 5px;
}

/* ── Toast ───────────────────────────────────────────────────────── */
#toasts { position: fixed; right: 18px; bottom: 18px; z-index: 90; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
.tst {
  background: var(--raise); border: 1px solid var(--line); border-left: 3px solid var(--ink-3);
  border-radius: 8px; padding: 9px 14px; font-size: 12.5px; box-shadow: var(--shadow);
  max-width: 380px; animation: rise .16s ease;
}
@keyframes rise { from { transform: translateY(6px); opacity: 0; } to { transform: none; opacity: 1; } }
.tst.ok { border-left-color: var(--ok); } .tst.bad { border-left-color: var(--bad); } .tst.warn { border-left-color: var(--warn); }

/* ── 登录 ────────────────────────────────────────────────────────── */
.login { min-height: 100vh; display: grid; place-items: center; padding: 24px; }
.login .card {
  width: 360px; max-width: 100%; background: var(--surface); border: 1px solid var(--line);
  border-radius: 16px; padding: 26px 24px; box-shadow: var(--shadow);
}
.login .card .mark { width: 38px; height: 38px; display: block; margin-bottom: 14px; }
.login h1 { font-size: 17px; font-weight: 650; letter-spacing: -.01em; }
.login p { color: var(--ink-3); font-size: 12.5px; margin: 4px 0 18px; }
.login .err { color: var(--bad); font-size: 12px; min-height: 18px; margin-top: 8px; }
.login .foot { margin-top: 14px; display: flex; align-items: center; gap: 8px; }

/* 顶栏汉堡与抽屉遮罩：桌面端完全不渲染 */
.nav-btn, .nav-veil { display: none; }

/* ── 移动端（≤860px）：侧栏 → 抽屉 ──────────────────────────────── */
@media (max-width: 860px) {
  .shell { grid-template-columns: 1fr; }
  .nav {
    position: fixed; top: 0; left: 0; bottom: 0; z-index: 70; width: 244px; max-width: 84vw;
    height: 100%; transform: translateX(-100%); transition: transform .22s ease;
    box-shadow: 0 0 40px rgba(0,0,0,.35);
  }
  .nav.open { transform: translateX(0); }
  .nav-btn {
    display: inline-grid; place-items: center; width: 32px; height: 32px; margin-right: 2px;
    border: 1px solid var(--line); background: var(--surface); border-radius: 8px; color: var(--ink-2);
  }
  .nav-veil { display: none; position: fixed; inset: 0; background: rgba(6,8,13,.45); z-index: 65; }
  .nav-veil.on { display: block; }
  .topbar { padding: 11px 14px; gap: 8px; flex-wrap: wrap; }
  .topbar .desc { display: none; }
  .wrap { padding: 12px 14px 40px; }
  .search input { width: 100%; }
  .search { flex: 1 1 160px; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .box > header { flex-wrap: wrap; }
  table.tbl { min-width: 720px; }
}
@media (max-width: 700px) {
  /* 手机端列预算：8 列的日志表硬塞进 390px 会每列都读不清，
     干脆把「频道 / TTFB / tokens」三列整列撤掉 —— 保留时间、模型、状态、耗时。 */
  table.tbl .opt { display: none; }
}
@media (max-width: 480px) {
  #pillRate { display: none; }
}
</style>
</head>
<body>

<!-- ══ 登录 ═══════════════════════════════════════════════════════════ -->
<div class="login" id="login">
  <div class="card">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b7cfa"/><path d="M9 20.5v-9l7 5.5 7-5.5v9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
    <h1>meoo2api</h1>
    <p>秒悟 Meoo 的 OpenAI 兼容网关 · 控制台</p>
    <div class="field">
      <label for="pw">管理密码</label>
      <input id="pw" type="password" autocomplete="current-password" placeholder="首次启动时控制台打印的密码">
    </div>
    <button class="btn primary" style="width:100%;justify-content:center" onclick="doLogin(this)">登录</button>
    <div class="err" id="loginErr"></div>
    <div class="foot">
      <span class="hint" id="loginVer">—</span>
      <span class="grow"></span>
      <button class="btn xs ghost" id="loginTheme" onclick="cycleTheme()">主题：自动</button>
    </div>
  </div>
</div>

<!-- ══ 主壳 ═══════════════════════════════════════════════════════════ -->
<div class="shell" id="app" hidden>
  <aside class="nav" id="nav">
    <div class="brand">
      <svg class="mark" viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="9" fill="#5b7cfa"/><path d="M9 20.5v-9l7 5.5 7-5.5v9" fill="none" stroke="#fff" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/></svg>
      <div>
        <div class="name">meoo2api</div>
        <div class="sub" id="navVer">dev</div>
      </div>
    </div>
    <ul id="navList">
      <li><a data-v="overview" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>概览</a></li>
      <li><a data-v="accounts" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.2"/><path d="M3.5 19.5c0-3 2.5-4.8 5.5-4.8s5.5 1.8 5.5 4.8"/><path d="M16 8.2a3 3 0 0 1 0 5.6M17.5 19.5c0-2-.7-3.4-1.8-4.2"/></svg>账号<span class="badge" id="navAcc">0</span></a></li>
      <li><a data-v="keys" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="12" r="3.6"/><path d="M11.6 12H21M18 12v3M15 12v2.4"/></svg>凭证<span class="badge" id="navKey">0</span></a></li>
      <li><a data-v="logs" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16M4 12h16M4 19h10"/></svg>日志</a></li>
      <li><a data-v="settings" tabindex="0"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4Z"/></svg>设置</a></li>
    </ul>
    <div class="sig">
      <div class="row"><span class="dot" id="sigDot"></span><span id="sigUp">—</span></div>
      <div class="row"><span class="mono" id="sigSub">—</span></div>
    </div>
  </aside>

  <button class="nav-veil" id="navVeil" onclick="toggleNav(false)" aria-hidden="true"></button>

  <main>
    <div class="topbar">
      <button class="nav-btn" onclick="toggleNav()" aria-label="打开导航">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <h1 id="ttl">概览</h1>
      <span class="desc" id="ttlDesc"></span>
      <span class="grow"></span>
      <span class="pill" id="pillUp"><span class="dot"></span><span>—</span></span>
      <span class="pill" id="pillRate">成功率 <span class="v">—</span></span>
      <button class="iconbtn" onclick="load(true)" title="刷新" aria-label="刷新">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11a8 8 0 1 0-1.6 5.3"/><path d="M20 5v6h-6"/></svg>
      </button>
      <button class="iconbtn" id="themeBtn" onclick="cycleTheme()" title="切换主题" aria-label="切换主题">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.6v2M12 19.4v2M2.6 12h2M19.4 12h2M5.4 5.4l1.4 1.4M17.2 17.2l1.4 1.4M18.6 5.4l-1.4 1.4M6.8 17.2l-1.4 1.4"/></svg>
      </button>
      <button class="btn xs ghost" onclick="doLogout()">退出</button>
    </div>
    <div class="wrap" id="view"></div>
  </main>
</div>

<div id="modalHost"></div>
<div id="toasts"></div>

<script>
"use strict";

/* ══ 状态 ══════════════════════════════════════════════════════════
   S 是最近一次 /admin/api/state 的原样快照；视图全部由它派生，
   不做本地缓存副本 —— 避免「面板显示」和「服务真实状态」两套真相。 */
let S = null;
let view = "overview";
let timer = null;          // 10s 心跳：只更新冷却倒计时，不重渲染整页
let logTimer = null;       // 日志页自动刷新
let logAuto = true;
let logFilter = { ch: "", status: "" };
let accQuery = "";
let accFilter = "all";
let devTimer = null;       // 设备授权轮询
let VER = "dev";
let UP = "api.meoo.host";

const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const nf = (n) => Number(n || 0).toLocaleString("zh-CN");
const ts = (ms) => { if (!ms) return "—"; const d = new Date(ms); return d.toLocaleString("zh-CN", { hour12: false }); };
const ago = (ms) => {
  if (!ms || Number(ms) <= 0) return "从未";
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return s + " 秒前";
  if (s < 3600) return Math.floor(s / 60) + " 分钟前";
  if (s < 86400) return Math.floor(s / 3600) + " 小时前";
  return Math.floor(s / 86400) + " 天前";
};
const dur = (sec) => {
  const s = Math.max(0, Math.floor(sec || 0));
  const h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60);
  return h ? h + " 小时 " + m + " 分" : m ? m + " 分" : s + " 秒";
};

function toast(msg, isErr) {
  const el = document.createElement("div");
  el.className = "tst " + (isErr ? "bad" : "ok");
  el.textContent = msg;
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), 2600);
}

async function api(path, opts) {
  const res = await fetch(path, Object.assign({ credentials: "same-origin", headers: { "Content-Type": "application/json" } }, opts || {}));
  if (res.status === 401) { showLogin(); throw new Error("未登录"); }
  const txt = await res.text();
  let data = null;
  try { data = txt ? JSON.parse(txt) : null; } catch (e) { throw new Error("响应非 JSON: " + txt.slice(0, 120)); }
  return data;
}

/* ══ 主题 ══════════════════════════════════════════════════════════ */
const THEMES = ["auto", "light", "dark"];
const THEME_LABEL = { auto: "自动", light: "浅色", dark: "深色" };
function applyTheme(pref) {
  const dark = pref === "dark" || (pref === "auto" && window.matchMedia("(prefers-color-scheme: dark)").matches);
  document.documentElement.dataset.theme = dark ? "dark" : "light";
  document.documentElement.dataset.pref = pref;
  const lbl = $("#loginTheme");
  if (lbl) lbl.textContent = "主题：" + THEME_LABEL[pref];
  const tb = $("#themeBtn");
  if (tb) tb.setAttribute("aria-label", "主题：" + THEME_LABEL[pref]);
}
function cycleTheme() {
  const cur = document.documentElement.dataset.pref || "auto";
  const next = THEMES[(THEMES.indexOf(cur) + 1) % THEMES.length];
  try { localStorage.setItem("meoo.theme", next); } catch (e) {}
  applyTheme(next);
}
window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => {
  if ((document.documentElement.dataset.pref || "auto") === "auto") applyTheme("auto");
});

/* ══ 登录 ══════════════════════════════════════════════════════════ */
function showLogin() {
  $("#login").style.display = "grid";
  $("#app").hidden = true;
  if (timer) { clearInterval(timer); timer = null; }
  if (logTimer) { clearInterval(logTimer); logTimer = null; }
}
function showApp() { $("#login").style.display = "none"; $("#app").hidden = false; }

async function doLogin(btn) {
  $("#loginErr").textContent = "";
  if (btn) { btn.disabled = true; }
  try {
    const r = await api("/admin/api/login", { method: "POST", body: JSON.stringify({ password: $("#pw").value }) });
    if (r.ok) { $("#pw").value = ""; showApp(); await load(); }
    else $("#loginErr").textContent = r.error || "登录失败";
  } catch (e) { $("#loginErr").textContent = e.message; }
  if (btn) btn.disabled = false;
}
$("#pw").addEventListener("keydown", (e) => { if (e.key === "Enter") doLogin(); });

async function doLogout() {
  try { await api("/admin/api/logout", { method: "POST" }); } catch (e) {}
  S = null;
  showLogin();
}

/* ══ 导航 ══════════════════════════════════════════════════════════ */
const TITLES = {
  overview: ["概览", "池子能不能用、钱花在哪，一屏读完"],
  accounts: ["账号", "上游账号与项目凭证的运营入口"],
  keys: ["凭证", "客户端密钥与号池凭证"],
  logs: ["日志", "只记录元数据，不落提示词与响应正文"],
  settings: ["设置", "请求参数、模型别名与管理密码"],
};
function goto(v) {
  view = v;
  document.querySelectorAll("#navList a").forEach((a) => a.classList.toggle("on", a.dataset.v === v));
  toggleNav(false);
  render();
}
$("#navList").addEventListener("click", (e) => {
  const a = e.target.closest("a[data-v]");
  if (a) goto(a.dataset.v);
});
$("#navList").addEventListener("keydown", (e) => {
  if (e.key !== "Enter" && e.key !== " ") return;
  const a = e.target.closest("a[data-v]");
  if (a) { e.preventDefault(); goto(a.dataset.v); }
});
function toggleNav(force) {
  const n = $("#nav"), veil = $("#navVeil");
  const open = force === undefined ? !n.classList.contains("open") : force;
  n.classList.toggle("open", open);
  veil.classList.toggle("on", open);
}
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { closeModal(); toggleNav(false); }
});

/* ══ 数据加载 ══════════════════════════════════════════════════════ */
async function load(silent) {
  try {
    const r = await api("/admin/api/state");
    if (!r || !r.ok) throw new Error((r && r.error) || "读取状态失败");
    S = r;
    showApp();
    renderChrome();
    render();
    if (!timer) timer = setInterval(tick, 10000);
    if (!silent && !S.accounts.length) { /* 空池时不做额外动作，空态已在视图里写明 */ }
  } catch (e) {
    if (String(e.message).indexOf("未登录") >= 0) return;
    toast(e.message, true);
  }
}

/* 顶栏与侧栏的状态位：只依赖 S，随时可独立刷新，不必重渲染整页 */
function renderChrome() {
  const usable = S.usable || 0;
  const accs = S.accounts || [];
  const keys = collectKeys();
  const healthy = keys.filter((k) => k.enabled && k.state === "ok").length;

  const pu = $("#pillUp");
  pu.innerHTML = '<span class="dot ' + (usable > 0 ? "ok pulse" : "bad") + '"></span><span>' +
    (usable > 0 ? "上游可用 " + usable : "无可用凭证") + "</span>";
  const st = S.stats || {};
  $("#pillRate").innerHTML = "成功率 <span class=\"v\">" + (st.success_rate || 0).toFixed(1) + "%</span>";

  $("#navAcc").textContent = String(accs.length);
  $("#navKey").textContent = String(keys.length);
  $("#navKey").className = "badge" + (healthy === 0 ? " bad" : "");

  const dot = $("#sigDot");
  dot.className = "dot " + (usable > 0 ? "ok" : "bad");
  $("#sigUp").textContent = usable > 0 ? "上游可用" : "无可用凭证";
  $("#sigSub").textContent = "v" + VER.replace(/^v/, "") + " · " + UP;

  const [t, d] = TITLES[view] || ["", ""];
  $("#ttl").textContent = t;
  $("#ttlDesc").textContent = d;
}

function collectKeys() {
  const out = [], seen = new Set();
  (S.accounts || []).forEach((a) => (a.keys || []).forEach((k) => { if (!seen.has(k.id)) { seen.add(k.id); out.push(k); } }));
  (S.orphan_keys || []).forEach((k) => { if (!seen.has(k.id)) { seen.add(k.id); out.push(k); } });
  return out;
}

function render() {
  if (!S) return;
  renderChrome();          // 标题、导航高亮、徽标都跟着 view 走，别只靠 load()
  const el = $("#view");
  if (view === "overview") el.innerHTML = viewOverview();
  else if (view === "accounts") el.innerHTML = viewAccounts();
  else if (view === "keys") el.innerHTML = viewKeys();
  else if (view === "logs") el.innerHTML = viewLogs();
  else if (view === "settings") el.innerHTML = viewSettings();
  tick();
  if (view === "logs") { loadLogs(); armLogTimer(); } else if (logTimer) { clearInterval(logTimer); logTimer = null; }
  if (view === "overview") loadOverviewLogs();
}

/* ══ 概览 ══════════════════════════════════════════════════════════ */
function viewOverview() {
  const st = S.stats || {};
  const accs = S.accounts || [];
  const keys = collectKeys();
  const ok = keys.filter((k) => k.enabled && k.state === "ok").length;
  const cooling = keys.filter((k) => k.state !== "ok" && k.state !== "invalid" && k.cooldown_sec > 0).length;
  const bad = keys.filter((k) => k.state === "invalid").length;
  const disabled = accs.filter((a) => !a.enabled).length;
  const points = accs.reduce((s, a) => s + (a.points || 0), 0);
  const cat = (S.catalog && S.catalog.status) || {};
  let cost = { spent: 0, tokens: 0, rate: 0 };
  accs.forEach((a) => {
    if (!a.cost) return;
    cost.spent += a.cost.spent || 0;
    cost.tokens += a.cost.tokens || 0;
  });
  if (cost.spent > 0) cost.rate = Math.round(cost.tokens / cost.spent);

  return `
  <div class="kpis">
    <div class="kpi ${ok ? "c-ok" : "c-bad"}">
      <div class="k">可用凭证</div>
      <div class="v">${ok}<small>/ ${keys.length}</small></div>
      <div class="s">冷却 ${cooling} · 失效 ${bad}</div>
    </div>
    <div class="kpi c-acc">
      <div class="k">账号</div>
      <div class="v">${accs.length}</div>
      <div class="s">停用 ${disabled} · 可用 ${S.usable || 0}</div>
    </div>
    <div class="kpi ${(st.success_rate || 0) >= 99 ? "c-ok" : "c-warn"}">
      <div class="k">对话成功率</div>
      <div class="v">${(st.success_rate || 0).toFixed(1)}<small>%</small></div>
      <div class="s">成功 ${nf(st.chat_ok)} · 失败 ${nf(st.chat_err)}</div>
    </div>
    <div class="kpi">
      <div class="k">平均首字节</div>
      <div class="v">${nf(st.avg_ttfb_ms)}<small> ms</small></div>
      <div class="s">总耗时 ${nf(st.avg_dur_ms)} ms</div>
    </div>
    <div class="kpi">
      <div class="k">累计 tokens</div>
      <div class="v">${nf(st.tokens)}</div>
      <div class="s">客户端密钥 ${(S.client_keys || []).length} 个</div>
    </div>
    <div class="kpi c-warn">
      <div class="k">积分成本</div>
      <div class="v">${nf(cost.spent)}<small> 分</small></div>
      <div class="s">${cost.rate ? "≈" + nf(cost.rate) + " tok/分" : "尚未采样"} · 余额 ${nf(points)}</div>
    </div>
  </div>

  <div class="two">
    <div class="box">
      <header><h3>上游与模型目录</h3><span class="grow"></span>
        <button class="btn xs" onclick="refreshCatalog(this)">同步目录</button>
        <button class="btn xs" onclick="sampleCost(this)">采样积分</button>
        <button class="btn xs" onclick="openDebug()">在线调试</button>
      </header>
      <div class="pad">
        <div class="kv"><span class="hint">上游</span> <b class="mono" style="font-size:11.5px">${esc(UP)}</b></div>
        <div class="kv" style="margin-top:7px"><span class="hint">目录</span> <b>${cat.source === "stale" ? "过期缓存" : "实时同步"} · ${cat.count || 0} 个模型</b>
          <span class="hint"> · ${ago(cat.fetched_at)}</span></div>
        <div class="kv" style="margin-top:7px"><span class="hint">默认模型</span> <b class="mono" style="font-size:11.5px">${esc(cat.default_model || "—")}</b></div>
        ${cat.error ? `<div class="hint" style="color:var(--bad);margin-top:7px">${esc(cat.error)}</div>` : ""}
        <div class="scroll-x" style="margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px">
          <table class="tbl" style="min-width:0">
            <thead><tr><th>模型 ID</th><th class="opt">说明</th></tr></thead>
            <tbody>${(S.models || []).length ? (S.models || []).slice(0, 12).map((m) => `
              <tr><td class="mono">${esc(m.id)}</td><td class="opt hint" style="color:var(--ink-3)">${esc(m.description || "—")}</td></tr>`).join("")
              : `<tr><td colspan="2"><div class="empty">目录为空 —— 号池里没有可用凭证时无法同步上游模型</div></td></tr>`}
            </tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="box">
      <header><h3>运行状况</h3></header>
      <div class="pad">
        <div class="kv"><span class="hint">进程运行</span> <b>${dur(S.uptime_sec)}</b></div>
        <div class="kv" style="margin-top:7px"><span class="hint">状态落盘</span>
          <b style="color:${S.save_error ? "var(--bad)" : "var(--ok)"}">${S.save_error ? "失败" : "正常"}</b></div>
        ${S.save_error ? `<div class="hint" style="color:var(--bad);margin-top:7px">${esc(S.save_error)}</div>` : ""}
        <div class="kv" style="margin-top:7px"><span class="hint">游离凭证</span> <b>${(S.orphan_keys || []).length} 条</b><span class="hint">未绑定账号</span></div>
        <div class="hint" style="margin-top:14px">调用示例</div>
        <pre class="out" style="margin-top:6px">curl http://127.0.0.1:8791/v1/chat/completions \
  -H "Authorization: Bearer sk-…" \
  -H "Content-Type: application/json" \
  -d '{"model":"qwen","messages":[{"role":"user","content":"你好"}]}'</pre>
      </div>
    </div>
  </div>

  <div class="box">
    <header><h3>最近请求</h3><span class="note">最近 8 条 · 元数据</span><span class="grow"></span>
      <button class="btn xs ghost" onclick="goto('logs')">查看全部</button></header>
    <div class="scroll-x">
      <table class="tbl">
        <thead><tr><th>时间</th><th>模型</th><th>状态</th><th class="opt">TTFB</th><th>耗时</th><th class="opt">tokens</th><th>账号 / 备注</th></tr></thead>
        <tbody id="ovLogs"><tr><td colspan="7"><div class="empty">加载中…</div></td></tr></tbody>
      </table>
    </div>
  </div>`;
}

async function loadOverviewLogs() {
  const tb = $("#ovLogs");
  if (!tb) return;
  try {
    const r = await api("/admin/api/logs?limit=8");
    const tb2 = $("#ovLogs");
    if (!tb2) return;
    const items = r.items || [];
    tb2.innerHTML = items.length ? items.map(logRow).join("")
      : `<tr><td colspan="7"><div class="empty">还没有请求。签发一个客户端密钥，按上面的 curl 打一次就有数据了</div></td></tr>`;
  } catch (e) { /* 概览里的次要模块失败不打扰用户 */ }
}

function logRow(e) {
  const st = e.status >= 400
    ? `<span class="tag bad">${e.status}</span>`
    : e.note ? `<span class="tag warn">${e.status}</span>` : `<span class="tag ok">${e.status}</span>`;
  const note = e.err || e.note || "";
  return `<tr>
    <td class="nw hint" style="color:var(--ink-3)">${ts(e.t).replace(/^\d+\//, "")}</td>
    <td class="mono">${esc(e.model || "—")}</td>
    <td>${st}</td>
    <td class="num opt">${e.ttfb_ms || 0} ms</td>
    <td class="num">${nf(e.dur_ms)} ms</td>
    <td class="num opt">${nf(e.total_tokens)}</td>
    <td class="hint" style="color:${e.err ? "var(--bad)" : e.note ? "var(--warn)" : "var(--ink-3)"};max-width:320px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(note || e.account || "")}">${esc(note || e.account || "—")}</td>
  </tr>`;
}

async function sampleCost(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "采样中…";
  try { await api("/admin/api/cost/sample", { method: "POST" }); await load(); toast("已采样积分"); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = old;
}

async function refreshCatalog(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "同步中…";
  try { await api("/admin/api/catalog/refresh", { method: "POST" }); await load(); toast("模型目录已刷新"); }
  catch (e) { toast(e.message, true); }
  btn.disabled = false; btn.textContent = old;
}

/* ══ 账号 ══════════════════════════════════════════════════════════ */
function accMatches(a) {
  if (accFilter !== "all") {
    const keys = a.keys || [];
    const ok = keys.filter((k) => k.enabled && k.state === "ok").length;
    const cooling = keys.some((k) => k.state !== "ok" && k.state !== "invalid" && k.cooldown_sec > 0);
    const invalid = keys.some((k) => k.state === "invalid");
    if (accFilter === "ok" && !ok) return false;
    if (accFilter === "cooling" && !(cooling && !ok)) return false;
    if (accFilter === "invalid" && !(invalid && !ok)) return false;
    if (accFilter === "off" && a.enabled) return false;
  }
  if (!accQuery) return true;
  const q = accQuery.toLowerCase();
  return [a.label, a.name, a.user_id, a.project_id].some((v) => String(v || "").toLowerCase().includes(q));
}

function keyState(keys) {
  if (!keys.length) return { cls: "mute", text: "无凭证" };

  if (keys.some((k) => k.state === "invalid")) return { cls: "bad", text: "凭证失效" };
  return { cls: "warn", text: "冷却中" };
}

/* ══ 添加账号：浏览器授权 / 粘贴 Cookie ════════════════════════════

function openAddAccount(mode) {

    <div id="devBox">

      <div class="bar"><i id="devBar"></i></div>
      <div class="state" id="devStat" style="margin-top:10px"><span class="dot warn"></span><span>等待授权…</span></div>

      </div>
      <p class="hint" style="margin-top:10px">在打开的页面登录并确认授权，本窗口会自动完成建项目、开云服务与入池。</p>

  modal(`

        <button class="${isCookie ? "" : "on"}" onclick="openAddAccount()">浏览器授权</button>
        <button class="${isCookie ? "on" : ""}" onclick="openAddAccount('cookie')">粘贴 Cookie</button>
      </div>
    </header>
    <div class="body">
      ${form}
      ${isCookie
        ? `<footer style="padding:0;border:none;margin-top:14px"><span class="grow"></span>

        : `<footer style="padding:0;border:none;margin-top:14px"><span class="grow"></span>
             <button class="btn" onclick="closeModal()">取消</button></footer>`}
    </div>`, { keep: true });

  if (!isCookie) startDevice();
}

/* 兼容旧调用（面板早期入口叫 openDevice） */
function openDevice() { openAddAccount(); }

/* 设备授权：← 这是之前缺的那一段。后端三个接口早就在，前端从没调用过，
   于是「浏览器授权」页签永远停在「创建授权会话中…」。 */
async function startDevice() {
  stopDevice();
  setDevStat("正在创建授权会话…", "wait");
  let sess;
  try {
    sess = await api("/admin/api/device/start", { method: "POST" });
  } catch (e) {
    setDevStat("创建失败：" + e.message, "bad");
    return;
  }
  if (!sess || !sess.ok) { setDevStat("创建失败：" + ((sess && sess.error) || "未知错误"), "bad"); return; }

  const urlEl = $("#devUrl");
  if (urlEl) urlEl.textContent = sess.login_url;
  const openEl = $("#devOpen");
  if (openEl) openEl.href = sess.login_url;
  setDevStat("等待你在浏览器完成授权…", "wait");

  const deadline = Date.now() + (sess.expires_in || 900) * 1000;
  let busy = false;
  devTimer = setInterval(async () => {
    if (busy) return;
    if (Date.now() > deadline) { stopDevice(); setDevStat("授权会话已过期，请重新打开本窗口", "bad"); return; }
    busy = true;
    try {
      const r = await api("/admin/api/device/poll?sid=" + encodeURIComponent(sess.session_id));
      const status = (r && r.status) || "unknown";
      if (status === "approved") {
        stopDevice();
        setDevStat("已授权，正在建项目并开通云服务…", "wait");
        const bar = $("#devBar");
        if (bar) bar.style.display = "none";
        // attach 是长连接：服务端要建项目、开云、读环境、入池，可能要几十秒
        const done = await api("/admin/api/device/attach", { method: "POST", body: JSON.stringify({ session_id: sess.session_id }) });
        if (done && done.ok) {
          setDevStat("接入成功，凭证已入池", "ok");
          await load();
          setTimeout(() => { closeModal(); toast("账号已接入"); }, 700);
        } else {
          setDevStat("接入失败：" + ((done && done.error) || "未知错误"), "bad");
        }
        return;
      }
      if (status === "expired") { stopDevice(); setDevStat("授权会话已过期，请重新打开本窗口", "bad"); return; }
      if (status === "unknown") { stopDevice(); setDevStat("授权会话不存在，请重新打开本窗口", "bad"); return; }
      if (r && r.ok === false && r.error) { setDevStat("轮询失败：" + r.error, "bad"); }
      else setDevStat("等待你在浏览器完成授权…（剩余 " + Math.max(0, Math.floor((deadline - Date.now()) / 1000)) + "s）", "wait");
    } catch (e) {
      setDevStat("轮询失败：" + e.message, "bad");
    } finally { busy = false; }
  }, 2500);
}

function stopDevice() {
  if (devTimer) { clearInterval(devTimer); devTimer = null; }
}

function setDevStat(msg, kind) {
  const el = $("#devStat");
  if (!el) return;
  const dot = kind === "ok" ? "ok" : kind === "bad" ? "bad" : "warn";
  el.className = "state" + (kind === "ok" ? " ok" : kind === "bad" ? " bad" : "");
  el.innerHTML = '<span class="dot ' + dot + '"></span><span>' + esc(msg) + "</span>";
}

function copyDev() {
  const t = $("#devUrl") ? $("#devUrl").textContent : "";
  if (!t) return;
  navigator.clipboard.writeText(t).then(() => toast("链接已复制"), () => toast("复制失败，请手动选中", true));
}

async function submitAddKey(btn) {
  btn.disabled = true;
  try {

  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

/* ══ 日志 ══════════════════════════════════════════════════════════ */
function viewLogs() {
  return `
  <div class="box">
    <header>
      <h3>请求日志</h3><span class="note">最近 200 条</span>
      <span class="grow"></span>
      <label class="hint" style="display:inline-flex;align-items:center;gap:6px;cursor:pointer">
        <input type="checkbox" ${logAuto ? "checked" : ""} onchange="logAuto=this.checked;armLogTimer();render()" style="width:auto"> 自动刷新
      </label>
      <button class="btn xs" onclick="loadLogs()">刷新</button>
    </header>
    <div class="pad tight" style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;border-bottom:1px solid var(--line-soft)">
      <select style="width:auto" id="fCh" onchange="logFilter.ch=this.value;loadLogs()">
        <option value="">全部频道</option>
        <option value="chat" ${logFilter.ch === "chat" ? "selected" : ""}>对话</option>
      </select>
      <select style="width:auto" id="fSt" onchange="logFilter.status=this.value;loadLogs()">
        <option value="">全部状态</option>
        <option value="ok" ${logFilter.status === "ok" ? "selected" : ""}>成功</option>
        <option value="err" ${logFilter.status === "err" ? "selected" : ""}>失败</option>
      </select>
      <span class="grow"></span>
      <span class="hint">只记录元数据，不落提示词与响应正文</span>
    </div>
    <div class="scroll-x">
      <table class="tbl">
        <thead><tr><th>时间</th><th class="opt">频道</th><th>模型</th><th>状态</th><th class="opt">TTFB</th><th>耗时</th><th class="opt">tokens</th><th>账号 / 备注</th></tr></thead>
        <tbody id="logBody"><tr><td colspan="8"><div class="empty">加载中…</div></td></tr></tbody>
      </table>
    </div>
  </div>`;
}

function armLogTimer() {
  if (logTimer) { clearInterval(logTimer); logTimer = null; }
  if (view === "logs" && logAuto) logTimer = setInterval(loadLogs, 5000);
}

async function loadLogs() {
  const tb = $("#logBody");
  if (!tb) return;
  try {
    const r = await api("/admin/api/logs?ch=" + encodeURIComponent(logFilter.ch) + "&status=" + encodeURIComponent(logFilter.status) + "&limit=200");
    const tb2 = $("#logBody");
    if (!tb2) return;
    const items = r.items || [];
    tb2.innerHTML = items.length ? items.map((e) => `<tr>
      <td class="nw hint" style="color:var(--ink-3)">${ts(e.t).replace(/^\d+\//, "")}</td>
      <td class="opt hint" style="color:var(--ink-3)">${esc(e.ch || "chat")}</td>
      <td class="mono">${esc(e.model || "—")}</td>
      <td>${e.status >= 400 ? `<span class="tag bad">${e.status}</span>` : e.note ? `<span class="tag warn">${e.status}</span>` : `<span class="tag ok">${e.status}</span>`}</td>
      <td class="num opt">${e.ttfb_ms || 0} ms</td>
      <td class="num">${nf(e.dur_ms)} ms</td>
      <td class="num opt">${nf(e.total_tokens)}</td>
      <td class="hint" style="color:${e.err ? "var(--bad)" : e.note ? "var(--warn)" : "var(--ink-3)"};max-width:360px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap" title="${esc(e.err || e.note || e.account || "")}">${esc(e.err || e.note || e.account || "—")}</td>
    </tr>`).join("") : `<tr><td colspan="8"><div class="empty">暂无日志</div></td></tr>`;
  } catch (e) { toast(e.message, true); }
}

/* ══ 设置 ══════════════════════════════════════════════════════════ */
function viewSettings() {
  const c = S.config || {};
  const aliasLines = Object.entries(c.aliases || {}).map(([k, v]) => k + "=" + v).join("\n");
  return `
  <div class="two">
    <div class="box">
      <header><h3>请求与号池</h3><span class="note">保存后立即生效，无需重启</span></header>
      <div class="pad">
        <div class="field"><label>默认 max_tokens<span class="hint">（0 = 跟随上游，不额外限制）</span></label>
          <input id="cMax" type="number" min="0" value="${c.default_max_tokens ?? 0}"></div>
        <div class="field"><label>上游超时（秒，30–900）</label>
          <input id="cTimeout" type="number" min="30" max="900" value="${c.request_timeout_sec || 180}"></div>
        <div class="field"><label>余额不足冷却（秒）</label>
          <input id="cQuota" type="number" min="0" value="${c.quota_cooldown_sec ?? 1800}"></div>
        <div class="field"><label>限流冷却（秒）</label>
          <input id="cRate" type="number" min="0" value="${c.rate_cooldown_sec ?? 600}"></div>
        <div class="field"><label>SSE 心跳间隔（秒，0 = 关闭）</label>
          <input id="cKeep" type="number" min="0" max="120" value="${c.keepalive_sec ?? 12}"></div>
        <label class="hint" style="display:flex;align-items:center;gap:8px;margin:2px 0 16px;cursor:pointer">
          <input id="cFailover" type="checkbox" ${c.failover ? "checked" : ""} style="width:auto">
          失败自动换号（仅限响应尚未开始发送时）
        </label>
        <button class="btn primary" onclick="saveConfig(this)">保存并立即生效</button>
      </div>
    </div>

    <div style="display:flex;flex-direction:column;gap:14px">
      <div class="box">
        <header><h3>模型别名</h3><span class="note">每行一个 别名=上游模型ID</span></header>
        <div class="pad">
          <textarea id="cAliases" rows="6" class="mono" style="font-size:12px">${esc(aliasLines)}</textarea>
          <p class="hint" style="margin-top:8px">别名让客户端可以用短名字请求。上游真实存在的模型见「概览 → 模型目录」。</p>
        </div>
      </div>
      <div class="box">
        <header><h3>管理密码</h3><span class="note">至少 8 位</span></header>
        <div class="pad">
          <div class="field"><label>新密码（留空不改）</label>
            <input id="cPw" type="password" autocomplete="new-password"></div>
          <button class="btn" onclick="saveConfig(this, true)">修改密码</button>
        </div>
      </div>
    </div>
  </div>`;
}

async function saveConfig(btn, withPassword) {
  btn.disabled = true;
  try {
    const aliases = {};
    const txt = $("#cAliases") ? $("#cAliases").value : "";
    txt.split("\n").forEach((line) => {
      const i = line.indexOf("=");
      if (i > 0) aliases[line.slice(0, i).trim().toLowerCase()] = line.slice(i + 1).trim();
    });
    const body = {
      default_max_tokens: Number($("#cMax").value || 0),
      request_timeout_sec: Number($("#cTimeout").value || 180),
      quota_cooldown_sec: Number($("#cQuota").value || 0),
      rate_cooldown_sec: Number($("#cRate").value || 0),
      keepalive_sec: Number($("#cKeep").value || 0),
      failover: $("#cFailover").checked,
      aliases,
    };
    if (withPassword) {
      const pw = $("#cPw").value;
      if (!pw) { toast("请输入新密码", true); btn.disabled = false; return; }
      body.new_password = pw;
    }
    const r = await api("/admin/api/config", { method: "POST", body: JSON.stringify(body) });
    if (r.ok) { toast("已保存"); await load(); if (withPassword) $("#cPw").value = ""; }
    else toast(r.error, true);
  } catch (e) { toast(e.message, true); }
  btn.disabled = false;
}

/* ══ 在线调试 ══════════════════════════════════════════════════════ */
function openDebug() {
  const opts = (S.models || []).map((m) => `<option value="${esc(m.id)}">${esc(m.id)}</option>`).join("");
  modal(`
    <header><h2>在线调试</h2></header>
    <div class="body">
      <p class="hint" style="margin-bottom:14px">直接打一次上游非流式对话，验证凭证与模型是否正常。</p>
      <div class="field"><label>模型</label><select id="dbgModel">${opts || "<option value=\"qwen\">qwen</option>"}</select></div>
      <div class="field"><label>内容</label><textarea id="dbgPrompt" rows="3">用一句话介绍你自己</textarea></div>
      <pre class="out" id="dbgOut" style="display:none"></pre>
    </div>
    <footer><span class="grow"></span><button class="btn" onclick="closeModal()">关闭</button>
      <button class="btn primary" onclick="runDebug(this)">发送</button></footer>`);
}

async function runDebug(btn) {
  btn.disabled = true; const old = btn.textContent; btn.textContent = "请求中…";
  const out = $("#dbgOut");
  out.style.display = "block"; out.textContent = "等待上游…";
  try {
    const r = await api("/admin/api/test", { method: "POST", body: JSON.stringify({ model: $("#dbgModel").value, prompt: $("#dbgPrompt").value, max_tokens: 256 }) });
    if (!r.ok) {
      out.textContent = "失败：" + (r.error || "") + (r.http ? "（HTTP " + r.http + "）" : "");
    } else {
      const c = r.raw && r.raw.choices && r.raw.choices[0];
      const text = c && c.message ? c.message.content : JSON.stringify(r.raw, null, 2);
      out.textContent = (text || "（空正文）") + "\n\n— " + r.elapsed_ms + " ms · " + (r.account || "") + " · " + (r.model || "");
    }
  } catch (e) { out.textContent = "失败：" + e.message; }
  btn.disabled = false; btn.textContent = old;
}

/* ══ 弹层与计时 ════════════════════════════════════════════════════ */
function modal(html, opts) {
  const keep = !!(opts && opts.keep);
  $("#modalHost").innerHTML = `<div class="veil on" onclick="if(event.target===this&&${!keep})closeModal()"><div class="dlg">${html}</div></div>`;
}
function closeModal() {
  stopDevice();
  $("#modalHost").innerHTML = "";
}

/* 冷却倒计时：只改文本，不重渲染整页（10s 心跳调用） */
function tick() {
  document.querySelectorAll("[data-until]").forEach((el) => {
    const until = Number(el.dataset.until || 0);
    const left = Math.ceil((until - Date.now()) / 1000);
    if (left <= 0) { el.textContent = "0s"; return; }
    el.textContent = left >= 60 ? Math.floor(left / 60) + "m" + (left % 60) + "s" : left + "s";
  });
}

/* ══ 启动 ══════════════════════════════════════════════════════════ */
(async function boot() {
  applyTheme(document.documentElement.dataset.pref || "auto");
  try {
    const h = await fetch("/healthz").then((r) => r.json());
    if (h && h.version) VER = h.version;
    if (h && h.upstream) UP = String(h.upstream).replace(/^https?:\/\//, "").replace(/\/meoo-ai.*$/, "");
    $("#loginVer").textContent = "版本 " + VER;
    $("#navVer").textContent = VER;
  } catch (e) { /* 版本号拿不到不影响使用 */ }
  try {
    const r = await api("/admin/api/ping");
    if (r.authed) { showApp(); await load(); } else showLogin();
  } catch (e) { showLogin(); }
})();
</script>
</body>
